[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nsrosenqvist/lang"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates (path deps; the pipeline DAG)
lang-span = { path = "crates/lang-span" }
lang-diagnostics = { path = "crates/lang-diagnostics" }
lang-ast = { path = "crates/lang-ast" }
lang-lexer = { path = "crates/lang-lexer" }
lang-parser = { path = "crates/lang-parser" }
lang-builtins = { path = "crates/lang-builtins" }
lang-backend = { path = "crates/lang-backend" }
lang-eval = { path = "crates/lang-eval" }
# M1 runtime crates (NaN-boxed values → register bytecode VM)
lang-value = { path = "crates/lang-value" }
lang-gc = { path = "crates/lang-gc" }
lang-bytecode = { path = "crates/lang-bytecode" }
lang-compiler = { path = "crates/lang-compiler" }
lang-vm = { path = "crates/lang-vm" }
lang-conformance = { path = "crates/lang-conformance" }

# External crates (pinned once; see docs/resources/03-implementation-plan.md §2)
logos = "0.16"
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"
proptest = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
# Quarantine unsafe: forbidden workspace-wide in M0. The first crates that may
# need it (the M1 `vm` NaN-boxing and `gc`) will override this locally.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
