[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nsrosenqvist/noeta"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates (path deps; the pipeline DAG)
noeta-span = { path = "crates/noeta-span" }
noeta-diagnostics = { path = "crates/noeta-diagnostics" }
noeta-ast = { path = "crates/noeta-ast" }
noeta-lexer = { path = "crates/noeta-lexer" }
noeta-parser = { path = "crates/noeta-parser" }
noeta-builtins = { path = "crates/noeta-builtins" }
noeta-backend = { path = "crates/noeta-backend" }
noeta-eval = { path = "crates/noeta-eval" }
# M1 runtime crates (NaN-boxed values → register bytecode VM)
noeta-object = { path = "crates/noeta-object" }
noeta-value = { path = "crates/noeta-value" }
noeta-gc = { path = "crates/noeta-gc" }
noeta-bytecode = { path = "crates/noeta-bytecode" }
noeta-bundle = { path = "crates/noeta-bundle" }
# Transparent startup cache (M3): content-addressed `.noeb` blob store under ~/.cache/noeta/ so a
# repeated `noeta run`/test/bench of unchanged sources skips the front-end. Blob-shaped, off the
# compile DAG — depends only on sha2.
noeta-cache = { path = "crates/noeta-cache" }
noeta-compiler = { path = "crates/noeta-compiler" }
noeta-vm = { path = "crates/noeta-vm" }
# JIT backend (milestone P-JIT): Cranelift tier-1 compiler, behind noeta-vm's `jit` feature.
noeta-jit = { path = "crates/noeta-jit" }
noeta-jit-abi = { path = "crates/noeta-jit-abi" }
noeta-db = { path = "crates/noeta-db" }
noeta-conformance = { path = "crates/noeta-conformance" }
# Test-only heap-residency probe (dev-dependency; tracking global allocator)
noeta-alloc-probe = { path = "crates/noeta-alloc-probe" }
# Core IR (memory-management migration: ANF lowering target)
noeta-ir = { path = "crates/noeta-ir" }
# Core IR passes (memory-management migration: precise-RC analyses + transforms)
noeta-ir-passes = { path = "crates/noeta-ir-passes" }
# M1 type checker (Thrust B)
noeta-types = { path = "crates/noeta-types" }
noeta-check = { path = "crates/noeta-check" }
# M1 modules (Thrust C)
noeta-loader = { path = "crates/noeta-loader" }
noeta-stdlib = { path = "crates/noeta-stdlib" }
# Native-extension ABI (P-NATIVE): the contract + dep-free primitives, split out of noeta-stdlib so
# the batteries (crypto/uuid/json) don't ride the ABI. noeta-stdlib re-exports it (core/std-style).
noeta-native = { path = "crates/noeta-native" }
# M2 runtime (host-coupled IO: real disk async + real env/args)
noeta-runtime = { path = "crates/noeta-runtime" }
# WASI host (P-WASM W1): the real-but-synchronous third `Host` for the wasm32-wasip1 runner —
# preopened-dir fs and WASI env/args/wall-clock/entropy through plain std; no tokio, no threads.
noeta-wasi-host = { path = "crates/noeta-wasi-host" }
# The wasm runner bin (P-WASM W1): VM on a `.noeb` bundle for wasm32-wasip1 — the L2-exe analogue.
noeta-wasm-runner = { path = "crates/noeta-wasm-runner" }
# M2 reactivity core (signal/computed/effect graph — value-generic, backend-driven)
noeta-reactive = { path = "crates/noeta-reactive" }
# M3 CRDT convergence core (p2p/local-first P0): state-based merge algebra — dep-free, value-less,
# the data-convergence layer of the local-first stack (§9.15), wrapped by `std.crdt`.
noeta-crdt = { path = "crates/noeta-crdt" }
# M2 editor tooling: the shared IDE engine (MCP M5) — DocumentStore + resolve/completion/signature/
# symbols over the noeta-db salsa graph, wire-protocol-free so `noeta lsp` and `noeta mcp` both
# adapt over the one implementation.
noeta-ide = { path = "crates/noeta-ide" }
# M2 editor tooling: the `noeta lsp` language server — a tower-lsp wire adapter over noeta-ide
noeta-lsp = { path = "crates/noeta-lsp" }
# M2 editor tooling: the `noeta dap` Debug Adapter Protocol server over the production VM
noeta-dap = { path = "crates/noeta-dap" }
# M2 dev tooling: the `noeta profile` dev profiler / flamegraph over the tier-0 production VM
noeta-prof = { path = "crates/noeta-prof" }
# Tooling: the `noeta fmt` canonical source formatter (lex+trivia → parse → AST → Doc → text)
noeta-fmt = { path = "crates/noeta-fmt" }
# Package manager (package-manager P2): manifest + transitive resolver + git/store/lock + registry
# index. A library (not in the CLI binary) so `noeta-lsp`/`noeta-db` can resolve dependencies too.
noeta-pm = { path = "crates/noeta-pm" }
# Agent-native tooling: the `noeta mcp` Model Context Protocol server (agent adapter over the
# salsa graph + VM — the third editor-tooling leg after lsp/dap). See plans/mcp/README.md.
noeta-mcp = { path = "crates/noeta-mcp" }

# External crates (pinned once; see docs/resources/03-implementation-plan.md §2)
logos = "0.16"
salsa = "0.27"
tokio = { version = "1", features = ["rt", "fs", "io-util", "time", "net"] }
# Real HTTP client for RealHost's `Network` capability (http arc), CLI-only (never in the hot
# interpreter core, never differential-tested). Async-first so it drives the `RealBody::Async`
# executor path with a genuine future; `rustls-tls` keeps it portable (no system OpenSSL). The
# deterministic sandbox has its own pure responder and pulls none of this in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# OS entropy for RealHost's `Entropy` capability (id-entropy U1): UUID v4/v7 random bits must be
# real entropy on the real host (the sandbox uses its own seeded SplitMix64 stream instead).
getrandom = "0.3"
# The machine hostname for RealHost's `Os` capability (stdlib-gaps) — std has no hostname API;
# this is the zero-dep libc/WinAPI wrapper.
gethostname = "1"
# Ed25519 signing for package provenance (package-manager Phase 4, #2) — CLI-only, behind the
# `provenance` feature so pure/offline consumers and the LSP don't pull it.
ed25519-dalek = "2"
# RFC 9562 UUID type + builders for the first-class `Uuid` (extern-types X2). Deliberately
# default-features = false: the self-generating constructors (`new_v4`/`new_v7`, behind the
# `v4`/`v7` features) stay OUT so the Host seam remains the only entropy/time source —
# `Builder::from_random_bytes`/`from_unix_timestamp_millis` take caller-provided bits.
uuid = { version = "1", default-features = false }
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
# Language-server framework (editor-tooling milestone): the maintained community fork of
# tower-lsp — async LanguageServer trait + JSON-RPC transport, composes with our tokio.
tower-lsp-server = "0.23"
# Agent-native tooling (MCP arc): the official Rust MCP SDK. Server + macros (the `#[tool]` /
# `#[tool_router]` surface) + stdio transport + schemars-backed tool-parameter schemas. Composes
# with the workspace tokio; only `noeta-mcp` (and the CLI entry point) pull it in.
rmcp = { version = "2.1", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
# JSON-Schema derive for tool-parameter and output types. Pinned to the major `rmcp` depends on so
# the `JsonSchema` trait is the same one the MCP SDK consumes. Also feature-gated onto
# `noeta-diagnostics` (feature `schema`) so its canonical `JsonDiagnostic` describes itself for MCP.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# Agent-native tooling (MCP arc, M1 Ground pillar): embed the docs (`docs/*.md`) and example
# (`tests/conformance/**/*.noe`) corpus into the `noeta` binary at compile time, so the MCP server's
# retrieval tools work from an installed binary with no repo beside it. Only `noeta-mcp` pulls it in.
include_dir = "0.7"
postcard = { version = "1", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"
serde_json = "1"
# Flamegraph SVG rendering for `noeta profile` (folded stacks → self-contained SVG). Pure Rust, no
# external `flamegraph.pl`/perl; `default-features = false` drops its CLI-binary deps.
inferno = { version = "0.12", default-features = false }
insta = "1"
proptest = "1"
# Append-only module storage for the debug console (tooling-unification T4): a fragment install
# swaps the running Vm's `&Module` to an extended snapshot, and the arena keeps every snapshot
# alive (stable addresses, `alloc(&self)`) for the rest of the run. Zero-dependency classic.
typed-arena = "2"
assert_cmd = "2"
predicates = "3"
criterion = { version = "0.5", default-features = false }
toml = "0.9"
# The package manager's SemVer vocabulary (Phase 2): `[package] version` + `[dependencies]` version
# requirements, and the PubGrub resolver's version type. The de-facto Cargo/crates.io implementation.
semver = "1"
# The dependency-resolution algorithm (Phase 2, user-chosen): PubGrub gives explainable conflict
# reports matching the project's diagnostic bar. `OfflineDependencyProvider` resolves a pre-walked
# in-memory graph, keeping the resolver pure + unit-testable (no network in the algorithm itself).
pubgrub = "0.3"
# Safe (unsafe-free API) checked byte↔`f32` reinterpret for the P-SIMD column kernels — the aligned
# `&[u8]`→`&[f32]` view that unlocks autovectorized reductions without `unsafe` in our source.
bytemuck = "1"
# Direct integer→decimal formatting for hot display paths (string interpolation holes): the
# `write!`/`fmt::Formatter` machinery costs ~2× the digits themselves on short ints.
itoa = "1"
# 24-byte small-string-optimized string for `Payload::Str` and map keys (P-SSO): ≤24-byte
# content lives inline in the payload — a short-lived string costs one allocation (the Obj),
# not two. Heap spill keeps capacity, so in-place append stays amortized O(n).
compact_str = "0.9"
# Extern map keys (extern-types X4): `MapKey` lives ONCE in noeta-stdlib so both backends share
# the ordering/display contract by construction. `equivalent` is the shared heterogeneous-lookup
# trait (hashbrown re-exports it), letting the VM probe a `HashMap<MapKey, _>` by bare `&str`
# with no key allocation — the P-SSO hot path unchanged. hashbrown = std's own table, taken
# directly for that `Equivalent`-based lookup API.
equivalent = "1"
hashbrown = { version = "0.17", default-features = false, features = ["equivalent", "inline-more", "default-hasher"] }
# std.crypto (crypto arc): RustCrypto digest family — never hand-roll primitives. sha1/md5 ship
# for interop (uuid_v5, legacy checksums), documented as non-collision-resistant. `bcrypt` is the
# password hasher; its salt comes through the Host `Entropy` capability, never self-generated.
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
# Constant-time equality for secret comparison (`crypto.constant_time_eq`, and the property the
# hmac verify twins rely on) — already in-tree transitively via `hmac`; never hand-roll this.
subtle = { version = "2", default-features = false }
bcrypt = { version = "0.17", default-features = false, features = ["alloc"] }
# Real p2p transport (p2p P3, behind noeta-runtime's `ring-p2p` feature — OFF by default): a
# p2panda-net node (gossip + log-sync over iroh/QUIC). Pre-1.0; pinned exactly because its
# user-facing API may break before 1.0. Never in a default build. `p2panda-core` supplies the
# `Hash`/`Topic` types; `futures-util` drives the gossip subscription stream in the drain task.
p2panda-net = "0.7"
p2panda-core = "0.7"
# Durable synced_signal transport (p2p P3.2): the log-sync store + sync-event types. `SqliteStore`
# (in-memory `temporary()`) holds the append-only operation logs; `p2panda-sync` provides the
# `TopicLogSyncEvent`/`Operation` sync surface. Same gated `ring-p2p` tree as p2panda-net.
p2panda-store = "0.7"
p2panda-sync = "0.7"
futures-util = "0.3"
# Group encryption for `synced_signal` (p2p P3.4b, same gated `ring-p2p` tree): p2panda's
# decentralised group key-agreement + encryption. `p2panda-spaces` is the high-level API (a `Space`
# encrypts operation payloads for a membership group with post-compromise security); it composes
# `p2panda-auth` (membership/access control) + `p2panda-encryption` (the XChaCha20-Poly1305 "data
# encryption" scheme, so late joiners can still decrypt history) over `p2panda-store`'s `spaces`
# tables. Pre-1.0; pinned exactly. Never in a default build.
p2panda-spaces = "0.7"
p2panda-auth = "0.7"
p2panda-encryption = { version = "0.7", features = ["data_scheme"] }

[workspace.lints.rust]
# Quarantine unsafe: forbidden workspace-wide in M0. The first crates that may
# need it (the M1 `vm` NaN-boxing and `gc`) will override this locally.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release binaries optimize as one unit (H5 bench finding): the default 16 codegen units made
# hot-loop code layout a per-build lottery (±40% swings on reactive microbenches from unrelated
# edits); one unit + thin LTO gives deterministic layout, cross-crate inlining, and a faster
# binary, at the cost of slower release builds.
[profile.release]
codegen-units = 1
lto = "thin"
