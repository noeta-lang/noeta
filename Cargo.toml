[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noeta-lang/noeta"
rust-version = "1.95"

[workspace.dependencies]
# Internal crates (path deps; the pipeline DAG)
# Language editions — the lowest crate (zero deps): the shared `Edition` vocabulary every layer
# (lexer, parser, checker, package manager) names without pulling in the pm stack.
noeta-edition = { path = "crates/noeta-edition" }
noeta-span = { path = "crates/noeta-span" }
noeta-diagnostics = { path = "crates/noeta-diagnostics" }
noeta-ast = { path = "crates/noeta-ast" }
noeta-lexer = { path = "crates/noeta-lexer" }
noeta-parser = { path = "crates/noeta-parser" }
noeta-builtins = { path = "crates/noeta-builtins" }
noeta-backend = { path = "crates/noeta-backend" }
noeta-eval = { path = "crates/noeta-eval" }
# M1 runtime crates (NaN-boxed values → register bytecode VM)
noeta-object = { path = "crates/noeta-object" }
noeta-value = { path = "crates/noeta-value" }
noeta-gc = { path = "crates/noeta-gc" }
noeta-bytecode = { path = "crates/noeta-bytecode" }
noeta-bundle = { path = "crates/noeta-bundle" }
# Transparent startup cache (M3): content-addressed `.noeb` blob store under ~/.cache/noeta/ so a
# repeated `noeta run`/test/bench of unchanged sources skips the front-end. Blob-shaped, off the
# compile DAG — depends only on sha2.
noeta-cache = { path = "crates/noeta-cache" }
noeta-compiler = { path = "crates/noeta-compiler" }
noeta-vm = { path = "crates/noeta-vm" }
# JIT backend (milestone P-JIT): Cranelift tier-1 compiler, behind noeta-vm's `jit` feature.
noeta-jit = { path = "crates/noeta-jit" }
noeta-jit-abi = { path = "crates/noeta-jit-abi" }
noeta-db = { path = "crates/noeta-db" }
noeta-conformance = { path = "crates/noeta-conformance" }
# Test-only heap-residency probe (dev-dependency; tracking global allocator)
noeta-alloc-probe = { path = "crates/noeta-alloc-probe" }
# Test-only fixture directories (dev-dependency): per-process temp roots, so no two test processes
# or checkouts share a fixture path. The one place a test temp path is built.
noeta-test-temp = { path = "crates/noeta-test-temp" }
# Core IR (memory-management migration: ANF lowering target)
noeta-ir = { path = "crates/noeta-ir" }
# Core IR passes (memory-management migration: precise-RC analyses + transforms)
noeta-ir-passes = { path = "crates/noeta-ir-passes" }
# M1 type checker (Thrust B)
noeta-types = { path = "crates/noeta-types" }
noeta-check = { path = "crates/noeta-check" }
# M1 modules (Thrust C)
noeta-loader = { path = "crates/noeta-loader" }
noeta-stdlib = { path = "crates/noeta-stdlib" }
# Native-extension ABI (P-NATIVE): the contract + dep-free primitives, split out of noeta-stdlib so
# the batteries (crypto/uuid/json) don't ride the ABI. noeta-stdlib re-exports it (core/std-style).
noeta-ext-abi = { path = "crates/noeta-ext-abi", version = "0.6.0" }
# M2 runtime (host-coupled IO: real disk async + real env/args)
noeta-host-real = { path = "crates/noeta-host-real" }
# Lean production runtime (dev-deps D3): the app-execution core (VM+Host+compile front-end, no dev
# tooling) shared by `noeta-cli` and the standalone `noeta-runner` binary. `default-features = false`
# here so a consumer's JIT rides *its own* `jit` feature (the CLI forwards it) — the standalone
# runner binary still builds its own `default = ["jit"]`.
noeta-runner = { path = "crates/noeta-runner", default-features = false }
# WASI host (P-WASM W1): the real-but-synchronous third `Host` for the wasm32-wasip1 runner —
# preopened-dir fs and WASI env/args/wall-clock/entropy through plain std; no tokio, no threads.
noeta-wasi-host = { path = "crates/noeta-wasi-host" }
# The wasm runner bin (P-WASM W1): VM on a `.noeb` bundle for wasm32-wasip1 — the L2-exe analogue.
noeta-wasm-runner = { path = "crates/noeta-wasm-runner" }
# The in-browser toolchain cdylib (P-WASM W2): the noeta.dev playground engine — check/run/fmt
# over the deterministic sandbox, compiled to wasm32-unknown-unknown behind a hand-rolled ABI.
noeta-playground = { path = "crates/noeta-playground" }
# The edge-serve component (P-WASM W4): `http.serve` handlers as wasi:http components for
# wasmtime-serve-class platforms (wasm32-wasip2).
noeta-wasm-serve = { path = "crates/noeta-wasm-serve" }
# M2 reactivity core (signal/computed/effect graph — value-generic, backend-driven)
noeta-reactive = { path = "crates/noeta-reactive" }
# The reactive extension **contract** (capability-broker seam): the trait an out-of-tree reactive-node
# extension (`para.synced`) programs against and the in-tree engine (`noeta-stdlib::reactive`)
# implements — reached per-run via `noeta_ext_abi::capability::<dyn ReactiveSource>`. Tiny: deps only
# noeta-ext-abi (NativeCtx/Retained) + noeta-reactive (NodeId). Neither engine internals nor consumer
# node types cross it.
noeta-reactive-abi = { path = "crates/noeta-reactive-abi", version = "0.6.0" }
# The project model: `project_check` — the one answer `noeta check`, the LSP's `workspace/diagnostic`
# and the MCP `check` tool all give — over the shared disk-backed salsa workspace construction.
# Editor-free by construction: a batch checker must not depend on an editor crate to answer whether
# a project compiles.
noeta-project = { path = "crates/noeta-project" }
# M2 editor tooling: the shared IDE engine (MCP M5) — DocumentStore + resolve/completion/signature/
# symbols over the noeta-db salsa graph, wire-protocol-free so `noeta lsp` and `noeta mcp` both
# adapt over the one implementation.
noeta-ide = { path = "crates/noeta-ide" }
# M2 editor tooling: the `noeta lsp` language server — a tower-lsp wire adapter over noeta-ide
noeta-lsp = { path = "crates/noeta-lsp" }
# M2 editor tooling: the `noeta dap` Debug Adapter Protocol server over the production VM
noeta-dap = { path = "crates/noeta-dap" }
# M2 dev tooling: the `noeta profile` dev profiler / flamegraph over the tier-0 production VM
noeta-prof = { path = "crates/noeta-prof" }
# Tooling: the `noeta fmt` canonical source formatter (lex+trivia → parse → AST → Doc → text)
noeta-fmt = { path = "crates/noeta-fmt" }
# Test-only structured input generation: `&[u8]` → a syntactically valid Noeta program, driving the
# formatter's oracle today and (by design) any later checker/VM/backend differential.
noeta-fuzz = { path = "crates/noeta-fuzz" }
# Package manager (package-manager P2): manifest + transitive resolver + git/store/lock + registry
# index. A library (not in the CLI binary) so `noeta-lsp`/`noeta-db` can resolve dependencies too.
noeta-pm = { path = "crates/noeta-pm" }
# Agent-native tooling: the `noeta mcp` Model Context Protocol server (agent adapter over the
# salsa graph + VM — the third editor-tooling leg after lsp/dap).
noeta-mcp = { path = "crates/noeta-mcp" }

# External crates (pinned once; see docs/resources/03-implementation-plan.md §2)
logos = "0.16"
salsa = "0.27"
tokio = { version = "1", features = ["rt", "fs", "io-util", "time", "net"] }
# Real HTTP client for RealHost's `Network` capability (http arc), CLI-only (never in the hot
# interpreter core, never differential-tested). Async-first so it drives the `RealBody::Async`
# executor path with a genuine future; `rustls-tls` keeps it portable (no system OpenSSL). The
# deterministic sandbox has its own pure responder and pulls none of this in.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `noeta upgrade` (toolchain self-update): unpack the release `noeta-<tag>-<target>.tar.gz`
# artifact. `flate2` was already in the tree transitively (compression codecs, `object`); `tar` is a new
# addition — the lightest maintained tar reader, used only by the CLI's upgrade verb.
flate2 = "1"
tar = "0.4"
# OS entropy for RealHost's `Entropy` capability (id-entropy U1): UUID v4/v7 random bits must be
# real entropy on the real host (the sandbox uses its own seeded SplitMix64 stream instead).
getrandom = "0.3"
# Dev-only (P-WASM W1.2 tests): build synthetic wasm modules and re-validate `staple_wasm`'s
# output with a full IR parse. The shipping patcher is a hand-rolled section-level rewrite.
walrus = "0.26"
# wasi 0.2 bindings for the edge-serve component (P-WASM W4): the `wasi:http/incoming-handler`
# export + proxy-world types. Target-gated to wasm32-wasip2 in the consuming crate.
wasi = "0.14"
# Timezone-aware calendar datetime for `std.datetime` (the Ring 3 datetime arc): DST-correct
# arithmetic, IANA tzdb, RFC-3339 + strftime formatting. BurntSushi's library. Optional in
# noeta-stdlib behind the default-on `ring-datetime` feature, so a `--no-default-features` /
# footprint-tailored build that never touches datetime sheds it (and the tzdb) entirely.
jiff = "0.2"
# The machine hostname for RealHost's `Os` capability (stdlib-gaps) — std has no hostname API;
# this is the zero-dep libc/WinAPI wrapper.
gethostname = "1"
# Ed25519 signing for package provenance (package-manager Phase 4, #2) — CLI-only, behind the
# `provenance` feature so pure/offline consumers and the LSP don't pull it.
ed25519-dalek = "2"
# Sigstore keyless provenance (package-manager Phase 5) — CLI-only, behind noeta-pm's `keyless`
# feature. prefix-dev's modular stack (the conda ecosystem's choice) over the official `sigstore`
# crate (tokio-bound, attestation verification incomplete) and `jdx/sigstore-verification`
# (verify-only yet a ~2× larger dep tree). Verification is fully OFFLINE and sync: cert chain →
# identity policy → SCT → Rekor inclusion proof + signed checkpoint, from a stored bundle.
# `default-features = false` sheds the clients' TLS stack (we never contact Rekor to verify);
# `sigstore-trust-root` without its `tuf` feature = the embedded pinned production root snapshot
# (TUF rotation is a surfaced deferral). Crypto backend is aws-lc-rs (C via `cc`, no cmake) —
# the one C build dep this buys, measured at ~13s wall for the whole stack.
sigstore-verify = { version = "0.11", default-features = false }
sigstore-trust-root = { version = "0.11", default-features = false }
sigstore-types = "0.11"
# The keyless PUBLISH side (Phase 5, K4): ambient OIDC (GitHub Actions et al. via `ambient-id`)
# → Fulcio cert for an ephemeral key → DSSE sign → Rekor entry → bundle. `rustls` (not the
# default native-tls) to match the workspace's TLS posture. Async by design upstream; noeta-pm
# wraps it in a scoped block_on (publish is CLI-only, never in the interpreter hot path).
sigstore-sign = { version = "0.11", default-features = false, features = ["rustls"] }
sigstore-oidc = { version = "0.11", default-features = false, features = ["rustls"] }
# `sigstore-oidc`'s own ambient-credential detector, pulled in directly so `ambient_identity` can
# read the crate's *structured* detection error (GitHub `InsufficientPermissions`, GitLab `Missing`)
# rather than the opaque string `sigstore-oidc::detect_ambient` flattens it into — the distinction
# between "this CI grants no id-token" (fall back to unsigned) and a genuinely broken token endpoint.
# Pin the exact version `sigstore-oidc` resolves so both see the SAME `ambient_id::Error` type.
ambient-id = "=0.0.11"
# Hermetic keyless test fixtures (Phase 5, K4 — `keyless-test-fixtures`, test builds only):
# minting a REAL test CA + CT log + Rekor log (certs with embedded SCTs, inclusion proofs,
# signed checkpoints) so the publish→resolve loop verifies under the DEFAULT policy with no
# network and no weakened checks. p256/x509-cert/tls-codec/const-oid mirror exactly what
# `sigstore-verify` consumes, so mint and verify can never drift.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["builder", "pem"] }
tls_codec = { version = "0.4", default-features = false, features = ["derive"] }
const-oid = { version = "0.9", default-features = false, features = ["db"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
# RFC 9562 UUID type + builders for the first-class `Uuid` (extern-types X2). Deliberately
# default-features = false: the self-generating constructors (`new_v4`/`new_v7`, behind the
# `v4`/`v7` features) stay OUT so the Host seam remains the only entropy/time source —
# `Builder::from_random_bytes`/`from_unix_timestamp_millis` take caller-provided bits.
uuid = { version = "1", default-features = false }
# `stacker`: chumsky's `recursive` combinator grows the stack on demand at parse time, so deeply
# nested input (or a `${…}` hole that re-enters the grammar deep in the parse) cannot overflow a
# small caller stack. Without it, `recursive` recurses on the bare caller stack — a ~2 MiB test
# thread overflows at moderate nesting now that the grammar is large.
# `memoization`: `Parser::memoized` caches a rule's *failures* at an offset, which is what stops one
# genuinely ambiguous alternative from re-parsing the same subtree per nesting level. The grammar has
# exactly one such garden path — a match arm's `=> { … }`, ambiguous between a map literal and a
# statement block — and it made nested `match` parse in 2^depth time. See `arm_body`.
chumsky = { version = "1.0.0-alpha.8", features = ["pratt", "stacker", "memoization"] }
# On-demand stack growth for the recursive-descent parser: a `${…}` interpolation hole re-enters the
# full grammar deep in the parse stack, so its construction runs under `stacker::maybe_grow` to keep
# a small caller stack (a ~2 MiB test thread) from overflowing. Already pulled in transitively by
# `chumsky`; named directly so the parser can call it.
stacker = "0.1"
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
# Filesystem watching for `--watch` (server-hmr W0): restart-on-change dev loop.
notify = "8"
# Language-server framework (editor-tooling milestone): the maintained community fork of
# tower-lsp — async LanguageServer trait + JSON-RPC transport, composes with our tokio.
tower-lsp-server = "0.23"
# Agent-native tooling (MCP arc): the official Rust MCP SDK. Server + macros (the `#[tool]` /
# `#[tool_router]` surface) + stdio transport + schemars-backed tool-parameter schemas. Composes
# with the workspace tokio; only `noeta-mcp` (and the CLI entry point) pull it in.
rmcp = { version = "2.1", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
# JSON-Schema derive for tool-parameter and output types. Pinned to the major `rmcp` depends on so
# the `JsonSchema` trait is the same one the MCP SDK consumes. Also feature-gated onto
# `noeta-diagnostics` (feature `schema`) so its canonical `JsonDiagnostic` describes itself for MCP.
schemars = "1"
serde = { version = "1", features = ["derive"] }
# Agent-native tooling (MCP arc, M1 Ground pillar): embed the docs (`docs/*.md`) and example
# (`tests/conformance/**/*.noe`) corpus into the `noeta` binary at compile time, so the MCP server's
# retrieval tools work from an installed binary with no repo beside it. Only `noeta-mcp` pulls it in.
include_dir = "0.7"
postcard = { version = "1", default-features = false, features = ["alloc"] }
miniz_oxide = "0.8"
serde_json = "1"
# Flamegraph SVG rendering for `noeta profile` (folded stacks → self-contained SVG). Pure Rust, no
# external `flamegraph.pl`/perl; `default-features = false` drops its CLI-binary deps.
inferno = { version = "0.12", default-features = false }
insta = "1"
proptest = "1"
# Append-only module storage for the debug console (tooling-unification T4): a fragment install
# swaps the running Vm's `&Module` to an extended snapshot, and the arena keeps every snapshot
# alive (stable addresses, `alloc(&self)`) for the rest of the run. Zero-dependency classic.
typed-arena = "2"
assert_cmd = "2"
predicates = "3"
# pty-driven expect testing for the interactive `noeta repl` prompt (dev-only, unix-only): the
# prompt opens only on a terminal, so a test that does not supply one tests the piped reader instead.
rexpect = "0.7"
criterion = { version = "0.5", default-features = false }
toml = "0.9"
ec4rs = "1"
# Text diffing for `noeta fmt --diff` (the unified-diff renderer). Already in the tree via `insta`.
similar = "2"
# Raw-mode line editing for the interactive `noeta repl` prompt (behind noeta-cli's `repl-tty`).
# Chosen for the seam, not the feature list: its `Highlighter`/`Completer`/`Validator` traits are
# each a question the toolchain can already answer — how a token colours (`noeta_ide::highlight`),
# what completes at the cursor (the IDE `DocumentStore`), and whether an entry is finished (the
# prompt's own `parse_entry`) — so the editor supplies terminal mechanics and no language knowledge.
# Default features minus `custom-bindings`: the prompt binds no keys of its own, so the radix trie
# that indexes custom bindings is dead weight.
rustyline = { version = "18", default-features = false, features = [
    "with-dirs",
    "with-file-history",
] }
# The package manager's SemVer vocabulary (Phase 2): `[package] version` + `[dependencies]` version
# requirements, and the PubGrub resolver's version type. The de-facto Cargo/crates.io implementation.
semver = "1"
# The dependency-resolution algorithm (Phase 2, user-chosen): PubGrub gives explainable conflict
# reports matching the project's diagnostic bar. `OfflineDependencyProvider` resolves a pre-walked
# in-memory graph, keeping the resolver pure + unit-testable (no network in the algorithm itself).
pubgrub = "0.3"
# Safe (unsafe-free API) checked byte↔`f32` reinterpret for the P-SIMD column kernels — the aligned
# `&[u8]`→`&[f32]` view that unlocks autovectorized reductions without `unsafe` in our source.
bytemuck = "1"
# Direct integer→decimal formatting for hot display paths (string interpolation holes): the
# `write!`/`fmt::Formatter` machinery costs ~2× the digits themselves on short ints.
itoa = "1"
# 24-byte small-string-optimized string for `Payload::Str` and map keys (P-SSO): ≤24-byte
# content lives inline in the payload — a short-lived string costs one allocation (the Obj),
# not two. Heap spill keeps capacity, so in-place append stays amortized O(n).
compact_str = "0.9"
# Extern map keys (extern-types X4): `MapKey` lives ONCE in noeta-stdlib so both backends share
# the ordering/display contract by construction. `equivalent` is the shared heterogeneous-lookup
# trait (hashbrown re-exports it), letting the VM probe a `HashMap<MapKey, _>` by bare `&str`
# with no key allocation — the P-SSO hot path unchanged. hashbrown = std's own table, taken
# directly for that `Equivalent`-based lookup API.
equivalent = "1"
hashbrown = { version = "0.17", default-features = false, features = ["equivalent", "inline-more", "default-hasher"] }
# Load-time registration of the std extension units as the registry's *fallback provider*
# (`noeta-stdlib::registry`), so linking the unit-declaring crate is enough to give a binary a
# working default registry — the property that makes test-binary seeding structural instead of
# remembered. It registers a function pointer; it installs nothing, so an assembling binary's
# explicit `install`/`install_with_extras` still wins. Deliberately NOT used on wasm (`#[ctor]` is
# unsupported there, and every wasm driver assembles its registry explicitly anyway).
ctor = "0.2"
# std.crypto (crypto arc): RustCrypto digest family — never hand-roll primitives. sha1/md5 ship
# for interop (uuid_v5, legacy checksums), documented as non-collision-resistant. `bcrypt` is the
# password hasher; its salt comes through the Host `Entropy` capability, never self-generated.
sha1 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
# Constant-time equality for secret comparison (`crypto.constant_time_eq`, and the property the
# hmac verify twins rely on) — already in-tree transitively via `hmac`; never hand-roll this.
subtle = { version = "2", default-features = false }
bcrypt = { version = "0.17", default-features = false, features = ["alloc"] }
# std.regex (Ring 3): the finite-automata engine, behind noeta-stdlib's default-on `ring-regex`.
# Chosen for its linear-time guarantee — a pattern cannot backtrack catastrophically on hostile
# input, which is the property that makes it safe to point at a request body. The cost is no
# lookaround and no backreferences; `fancy-regex` adds both by falling back to a backtracker and
# forfeits exactly that guarantee, so it is not the default. `unicode` is kept in full (it is the
# bulk of the crate's size) precisely BECAUSE the ring gates it: a build that wants regex wants
# `\p{...}` and correct case-folding to work, and a build that doesn't sheds the whole tree.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# Real p2p transport (p2p P3, behind noeta-host-real's `ring-p2p` feature — OFF by default): a
# p2panda-net node (gossip + log-sync over iroh/QUIC). Pre-1.0; pinned exactly because its
# user-facing API may break before 1.0. Never in a default build. `p2panda-core` supplies the
# `Hash`/`Topic` types; `futures-util` drives the gossip subscription stream in the drain task.
p2panda-net = "0.7"
p2panda-core = "0.7"
# Durable synced_signal transport (p2p P3.2): the log-sync store + sync-event types. `SqliteStore`
# (in-memory `temporary()`) holds the append-only operation logs; `p2panda-sync` provides the
# `TopicLogSyncEvent`/`Operation` sync surface. Same gated `ring-p2p` tree as p2panda-net.
p2panda-store = "0.7"
p2panda-sync = "0.7"
futures-util = "0.3"
# Group encryption for `synced_signal` (p2p P3.4b, same gated `ring-p2p` tree): p2panda's
# decentralised group key-agreement + encryption. `p2panda-spaces` is the high-level API (a `Space`
# encrypts operation payloads for a membership group with post-compromise security); it composes
# `p2panda-auth` (membership/access control) + `p2panda-encryption` (the XChaCha20-Poly1305 "data
# encryption" scheme, so late joiners can still decrypt history) over `p2panda-store`'s `spaces`
# tables. Pre-1.0; pinned exactly. Never in a default build.
p2panda-spaces = "0.7"
p2panda-auth = "0.7"
p2panda-encryption = { version = "0.7", features = ["data_scheme"] }

[workspace.lints.rust]
# Quarantine unsafe: forbidden workspace-wide in M0. The first crates that may
# need it (the M1 `vm` NaN-boxing and `gc`) will override this locally.
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release binaries optimize as one unit (H5 bench finding): the default 16 codegen units made
# hot-loop code layout a per-build lottery (±40% swings on reactive microbenches from unrelated
# edits); one unit + thin LTO gives deterministic layout, cross-crate inlining, and a faster
# binary, at the cost of slower release builds.
[profile.release]
codegen-units = 1
lto = "thin"

# The wasm runner's artifact profile (P-WASM W1.4): release plus `strip` — the emitted wasm
# carries a ~220 KiB `name` custom section that only feeds wasmtime's trap backtraces (Noeta
# tracebacks come from the bundle's own line table), so stripping is free: 2.42 → 2.20 MiB at
# identical speed. A full size build (opt-level=z + fat LTO + panic=abort) was measured and
# REJECTED as the default: 1.37 MiB but ~60% slower on the interpreter hot loop (fib(31) warm:
# 0.51 s → 0.82 s) — edge compute wants the throughput; size-critical deploys can still build
# that shape themselves and point NOETA_WASM_RUNNER at it.
[profile.wasm-release]
inherits = "release"
strip = true
