# The native entry crate for the `para/api` package. Standalone (its own empty `[workspace]`) so the
# composed toolchain can build it as a path dependency without the main workspace adopting it,
# exactly like `para-db-native` and the generated shim. It re-exports the `noeta-para-api` crate's
# extension slice under the fixed `NOETA_EXTENSIONS` convention.
[package]
name = "para-api-native"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
# In-tree, the impl crate is a monorepo path (so a fresh checkout of THIS repo builds the demo with
# no network). A standalone clone would instead reference the impl by git on the toolchain repo +
# `[patch]` — see `packages/README.md`.
noeta-para-api = { path = "../../../crates/noeta-para-api" }

[workspace]
