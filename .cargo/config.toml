# Workspace Cargo configuration.

[env]
# Silence miri's exposed-provenance warning. The value representation (`crates/noeta-value`)
# NaN-boxes pointers, which requires an int<->pointer round-trip through the exposed-provenance
# API (`expose_provenance` / `with_exposed_provenance_mut`). That is the miri-sound way to stash a
# pointer's address in a tagged `u64` and recover it, but miri's strict-provenance checker still
# emits an informational warning for the exposed-provenance model. This flag acknowledges the
# deliberate, sound use so miri runs are quiet by default. (Set `MIRIFLAGS` in the environment to
# override — an explicit value wins over this one.)
MIRIFLAGS = "-Zmiri-permissive-provenance"

# The browser wasm target (P-WASM W2): `getrandom` 0.3 refuses wasm32-unknown-unknown without an
# explicit backend choice. `custom` — the `noeta-playground` cdylib defines the (unreachable)
# hook: the only getrandom consumer in the tree is `bcrypt`'s dead salt path (salts arrive as
# arguments from the Host `Entropy` capability), and the playground runs on the deterministic
# `SandboxHost`. No `wasm_js`/wasm-bindgen creep into the dependency graph.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="custom"']
