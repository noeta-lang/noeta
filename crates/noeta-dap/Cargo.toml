[package]
name = "noeta-dap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The debugger drives the *production* compile+run pipeline (the same path `noeta run` takes), so it
# reuses the loader, checker, compiler, and VM directly — not the salsa IDE queries the LSP uses.
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
noeta-value = { workspace = true }
noeta-loader = { workspace = true }
noeta-check = { workspace = true }
noeta-compiler = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-vm = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-runtime = { workspace = true }
# Only the DAP wire format is hand-rolled; the JSON payloads themselves ride serde_json (Content-Length
# framing + request/response/event envelopes mirror the LSP's stdio loop, minus the tower-lsp machinery).
serde_json = { workspace = true }

[lints]
workspace = true
