[package]
name = "noeta-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

# The embedding API (server-hmr E0): a host process — a game engine's scripting layer being the
# canonical consumer — drives a live Noeta session from its own loop: load, call by name, hot-swap
# on file change. DELIBERATELY UNSTABLE (0.x): the surface adapts to growing needs until a real
# engine integration has exercised it; no ABI freeze, breaking changes allowed between minors.

[dependencies]
noeta-vm = { workspace = true }
noeta-compiler = { workspace = true }
noeta-check = { workspace = true }
noeta-parser = { workspace = true }
noeta-lexer = { workspace = true }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-ext-abi = { workspace = true }
noeta-host-real = { workspace = true }

[lints]
workspace = true
