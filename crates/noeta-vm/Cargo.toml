[package]
name = "noeta-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-ast = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-backend = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-compiler = { workspace = true }
noeta-value = { workspace = true }
noeta-gc = { workspace = true }
noeta-span = { workspace = true }
noeta-object = { workspace = true }
noeta-stdlib = { workspace = true }
# Debug-console module arena (tooling-unification T4): fragment installs swap the running Vm's
# `&Module` to an extended snapshot; the arena keeps each snapshot alive to end of run.
typed-arena = { workspace = true }
# Tier-1 JIT (milestone P-JIT), optional — only pulled in under the `jit` feature.
noeta-jit = { workspace = true, optional = true }
# The cranelift-free JIT/AOT ABI contract (frame layout, CompiledFn, helper names, dispatch symbol).
# Pulled in by BOTH `jit` and `aot` — it is the runtime-support surface, so the AOT runtime can link
# it without Cranelift. `noeta-jit` also re-exports it, so `noeta_jit::*` paths keep working under `jit`.
noeta-jit-abi = { workspace = true, optional = true }

[features]
# The Cranelift method JIT (P-JIT). Off by default: without it the crate never pulls Cranelift,
# and the interpreter/sandbox/differential are byte-identical — the same gating the real-thread
# isolates use. `noeta-conformance` turns it on to run the `--jit-differential` oracle.
jit = ["dep:noeta-jit", "dep:noeta-jit-abi", "jit-rt"]
# P-AOT L3.4 A2: run pre-compiled native bodies WITHOUT the Cranelift compiler. An ahead-of-time
# binary binds a static dispatch table and never JIT-compiles (`run_module_aot` runs with
# `self.jit == None`), so it needs only the runtime support — the `noeta_jit_*` helpers (exported
# under their canonical C names), the per-proto dispatch tables, and the AOT dispatch binding — not
# the ~20 MB compiler. So `aot` pulls `noeta-jit-abi` (the cranelift-free ABI) and `jit-rt`, but NOT
# `noeta-jit`. Off by default — only the AOT runtime staticlib turns it on.
aot = ["dep:noeta-jit-abi", "jit-rt"]
# Internal: the JIT/AOT *runtime support* — the helper functions the native bodies call, the
# per-proto dispatch tables, `jit_install`/`bind_aot_dispatch`/`run_module_aot`, and the frame-entry
# native-dispatch gate. Enabled by both `jit` (which adds the compiler on top) and `aot` (which does
# not). Never enable directly.
jit-rt = []

[dev-dependencies]
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
# The adopted-session test compiles a *checked* program (`compile_with_sites_session`), the same
# dance the debug adapter's launch path runs. Test-only — the VM itself stays checker-free.
noeta-check = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "vm"
harness = false

[[bench]]
name = "map_keys"
harness = false

[[bench]]
name = "reactivity"
harness = false

# This crate re-states the workspace lint table with one change: `unsafe_code` is `deny` (not the
# workspace's `forbid`) so the single tier-1 JIT dispatch site (P-JIT) — which calls a
# Cranelift-finalized `extern "C"` function pointer — can opt in with an explicit
# `#[allow(unsafe_code)]`. Everything else in the crate stays unsafe-free (`deny` catches it).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[example]]
name = "jit_pause"
required-features = ["jit"]
