[package]
name = "noeta-wasi-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-stdlib = { workspace = true }
compact_str = { workspace = true }
# WASI entropy (`random_get` on wasip1); the same crate RealHost uses for OS entropy. The
# browser target (wasm32-unknown-unknown) is the one that needs backend wiring —
# this crate targets wasip1, where getrandom works out of the box.
getrandom = { workspace = true }

[dev-dependencies]
# The filesystem round-trip test writes into a per-process fixture directory, not the shared
# system temp dir (where it asserted on a directory listing anyone could add to).
noeta-test-temp = { workspace = true }

[lints]
workspace = true
