[package]
name = "noeta-diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
ariadne = { workspace = true }
serde = { workspace = true }
# Optional: derive `JsonSchema` on the machine-readable `JsonDiagnostic` family so consumers that
# need a schema (the MCP server's `check` tool output) get one from the single source of truth.
# Off by default — only `noeta-mcp` enables it, so the core crate stays schemars-free otherwise.
schemars = { workspace = true, optional = true }

[features]
schema = ["dep:schemars"]

[lints]
workspace = true
