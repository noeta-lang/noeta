[package]
name = "lang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lang"
path = "src/main.rs"

[dependencies]
lang-span = { workspace = true }
lang-ast = { workspace = true }
lang-backend = { workspace = true }
lang-diagnostics = { workspace = true }
lang-lexer = { workspace = true }
lang-parser = { workspace = true }
lang-eval = { workspace = true }
lang-vm = { workspace = true }
lang-compiler = { workspace = true }
lang-bytecode = { workspace = true }
lang-check = { workspace = true }
lang-loader = { workspace = true }
lang-runtime = { workspace = true }
lang-stdlib = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

[features]
# The shipped `lang` binary is JIT-enabled by default (milestone P-JIT): real-host `lang run`/
# `bench` drive the tier-1 JIT under hot-counter promotion. `--no-default-features` builds a
# Cranelift-free interpreter-only binary (identical behaviour, smaller build).
default = ["jit"]
jit = ["lang-vm/jit"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
