[package]
name = "noeta-check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-ast = { workspace = true }
noeta-edition = { workspace = true }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-types = { workspace = true }
# The extension-registry mechanism and signature vocabulary (Registry, SigType, TypeRecipe,
# IntMethod, ...). The std units are data seeded by the assembling driver — this crate
# deliberately does NOT link noeta-stdlib, so a stdlib method-body edit no longer rebuilds the
# checker (audit-6 F2).
noeta-ext-abi = { workspace = true }

[dev-dependencies]
# Tests and the corpus bench are their own assembling driver: they seed the process-default
# registry with the std units (a dev-dep never re-enters the library build graph).
noeta-stdlib = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "check"
harness = false

[lints]
workspace = true
