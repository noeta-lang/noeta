[package]
name = "noeta-builtins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
noeta-ast = { workspace = true }

[dev-dependencies]
# Test-only: both censuses here are claims about the lexer's token table, checked against it here —
# `PRELUDE`'s `Keyword`/`Value` form, and `REFLECTION_INTRINSICS`'s completeness over the
# `ReservedRole::Reflection` family. A dev-dependency keeps the claims honest without putting the
# lexer on this crate's (or `noeta-check`'s) build graph.
noeta-lexer = { workspace = true }

[lints]
workspace = true
