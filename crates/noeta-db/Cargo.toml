[package]
name = "noeta-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-compiler = { workspace = true }
noeta-check = { workspace = true }
noeta-ext-abi = { workspace = true }
noeta-loader = { workspace = true }
salsa = { workspace = true }

# This crate deliberately does NOT inherit the workspace lint table: the salsa
# `Update` impls for the pass-through result newtypes are `unsafe` (a small,
# audited always-replace surface — see the `replace_update!` macro). It re-states
# the rest of the workspace lints minus `unsafe_code = "forbid"`.
[dev-dependencies]
# Tests are their own assembling driver: they seed the process-default registry with the std
# units (a dev-dep never re-enters the library build graph).
noeta-stdlib = { workspace = true }
# The heap-residency probe for the deleted-input reclamation test (audit F9 residual a).
noeta-alloc-probe = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
