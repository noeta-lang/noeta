[package]
name = "noeta-value"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
hashbrown = { workspace = true }
noeta-ast = { workspace = true }
# A first-class prelude builtin value (`Payload::NativeFn`) stores the `Builtin` id it dispatches
# on. noeta-bytecode does not depend on noeta-value, so this adds no dependency cycle.
noeta-bytecode = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-object = { workspace = true }
# The extension-ABI contract crate: ExternValue/ExternBox/MapKey/NativeValue, the Executor trait,
# and the shared text halves (float formatting, JSON serialization in `json_text`) — everything the
# value model consumes. This deliberately replaces the old noeta-stdlib edge (cross-cutting audit
# finding 2): a stdlib method-body edit no longer rebuilds the value model, GC, or the VM above it.
noeta-ext-abi = { workspace = true }
# Hot-path integer formatting for interpolation holes (`display_into`); bypasses `fmt::Formatter`.
itoa = { workspace = true }
# The SSO string inside `Payload::Str` (P-SSO); re-exported for the `BuildString` seam.
compact_str = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# This crate deliberately does NOT inherit the workspace lint table: it is one of the
# few crates allowed `unsafe` (the NaN-box pointer round-trip and heap-header access).
# It re-states the rest of the workspace lints minus `unsafe_code = "forbid"`.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
