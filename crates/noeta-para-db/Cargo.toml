[package]
name = "noeta-para-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The extension ABI (the module/type registry, ExternValue contract, error constructors).
noeta-ext-abi = { workspace = true }
# The reactive DB source (`db.watch`, aether DB5) is a node in the SAME reactive graph as core
# `std.reactive`, reached through the `ReactiveSource` capability contract — never the engine
# internals (so this crate depends on nothing of `noeta-stdlib`). `noeta-reactive` supplies the
# `NodeId` handle; `noeta-reactive-abi` the capability + view-source contract. Same seam para.synced
# uses. Light crates, always linked (the `db.watch` surface works for any driver — SQLite degrades to
# in-process-only, Postgres adds external LISTEN/NOTIFY).
noeta-reactive = { workspace = true }
noeta-reactive-abi = { workspace = true }
# The migration engine checksums each migration file's contents (sha256) to detect edited history.
# Always linked (the engine is driver-agnostic and rides no ring).
sha2 = { workspace = true }
# The SQLite driver, behind the `ring-sqlite` ring. `bundled` compiles SQLite from source, so a
# consumer needs no system libsqlite3 (the amalgamation reuses the workspace's existing
# libsqlite3-sys build). Optional + gated exactly like para-p2p's `ring-p2p`: a pure/loopback build
# that never touches `para.db` links no SQLite.
# `hooks` enables the per-connection update hook (DB5 reactive source — SQLite has no LISTEN/NOTIFY,
# so a write fires the hook, which publishes to the process notification bus).
rusqlite = { version = "0.32", features = ["bundled", "hooks"], optional = true }
# The PostgreSQL driver, behind the `ring-postgres` ring. The synchronous `postgres` client (blocking,
# its own runtime) fits the sync `SqlDriver` trait exactly like `rusqlite`. Optional + off by default:
# a build that never connects to Postgres links no PG client. A second driver behind the SAME seam —
# the whole point of the swappable-driver design (DB0).
postgres = { version = "0.19", optional = true }
# `BytesMut` — the wire buffer the `ToSql` trait writes into. Named only by the PG param adapter, so
# it rides the same `ring-postgres` gate.
bytes = { version = "1", optional = true }
# TLS for Postgres — a pure-Rust rustls connector (ring provider, no OpenSSL/C build) with the
# bundled Mozilla roots (`webpki-roots`, so no system trust store needed). The dsn's `sslmode`
# governs whether it is used (default `prefer`: try TLS, fall back to plaintext). All ride
# `ring-postgres`.
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
], optional = true }
webpki-roots = { version = "1", optional = true }

[features]
# Default-on for local dev (so `cargo build`/`noeta run` get a working SQLite driver out of the box);
# the composed toolchain forwards it, and a future `--native` footprint scan can shed it when the
# program never imports `para.db`. Mirrors the para-p2p `ring-p2p` gate.
default = ["ring-sqlite"]
ring-sqlite = ["dep:rusqlite"]
# Opt-in: a build wanting a `postgres://` connection turns this on (e.g. `[targets]`/manifest feature
# forwarding, or `--features`). SQLite-only builds never pull the PG client.
ring-postgres = [
    "dep:postgres",
    "dep:bytes",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]

[lints]
workspace = true
