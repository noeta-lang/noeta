[package]
name = "noeta-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

# A thin tower-lsp wire adapter: every language feature lives in noeta-ide (the shared IDE engine,
# MCP M5), so this crate needs only the engine, the diagnostic model it maps onto the wire, and the
# transport.

[dependencies]
noeta-ide = { workspace = true }
# `workspace/diagnostic` answers with `project_check` — the same function `noeta check` calls.
noeta-project = { workspace = true }
noeta-diagnostics = { workspace = true }
# For `SERVER_STACK_SIZE` only: the parser owns the deepest recursion a server thread runs, so it
# owns the stack size those threads need (tokio's 2 MiB default is below it in a debug build).
noeta-parser = { workspace = true }
# tokio: the workspace pin gives us rt/io-util/time; the server also needs the stdio driver
# (`io-std`) for the JSON-RPC transport, a worker pool (`rt-multi-thread`), and `#[tokio::main]`
# (`macros`). Feature-unified with the rest of the workspace's tokio usage.
tokio = { workspace = true, features = ["io-std", "rt-multi-thread", "macros"] }
tower-lsp-server = { workspace = true }
# The `noeta/trace` custom request (ide-ui U2): its params/result are plain serde shapes, and the
# role CodeLens carries JSON command arguments.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
# Tests seed the process-default registry (audit-6 F2).
noeta-stdlib = { workspace = true }

[lints]
workspace = true
