[package]
name = "noeta-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
noeta-bundle = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-ir = { workspace = true }
noeta-ir-passes = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
noeta-backend = { workspace = true }
noeta-eval = { workspace = true }
noeta-value = { workspace = true }
noeta-check = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-compiler = { workspace = true }
noeta-vm = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-db = { workspace = true }
noeta-loader = { workspace = true }
# What a package *is* (a `noeta.toml`) and what prefix its modules derive under lives in the package
# manager — a case directory declaring a manifest becomes a package the same way a real one does,
# rather than the harness re-deciding it (`case_root`).
noeta-pm = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Enable the JIT (P-JIT) and its `--jit-differential` oracle. Off by default: the harness builds and
# runs the eval↔interpreter differential without pulling Cranelift. `cargo run -p noeta-conformance
# --features jit -- --jit-differential` turns it on.
jit = ["noeta-vm/jit"]

[dev-dependencies]
insta = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
noeta-alloc-probe = { workspace = true }
# Per-process fixture directories for the tests that link a real on-disk project.
noeta-test-temp = { workspace = true }

[lints]
workspace = true
