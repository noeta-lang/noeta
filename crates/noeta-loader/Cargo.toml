[package]
name = "noeta-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
# The extension-registry mechanism only (the process-default Registry handle + verbatim-tier
# names). The std units are data seeded by the assembling driver — this crate deliberately does
# NOT link noeta-stdlib, so a stdlib method-body edit no longer rebuilds the loader (audit-6 F2).
noeta-ext-abi = { workspace = true }

[dev-dependencies]
# Tests are their own assembling driver: they seed the process-default registry with the std
# units before linking (a dev-dep never re-enters the library build graph, so stdlib body edits
# still skip this crate's lib).
noeta-stdlib = { workspace = true }
# The expansion tests check what they link: whether a generated member collides with a hand-written
# one is the checker's judgement (E0079), and asserting it here is what proves the loader's
# expansion stamp survives the trip. A dev-dep only, so the library layering is unchanged.
noeta-check = { workspace = true }
# Scratch projects for the linking tests, private to each process: this crate links an entry's
# sibling files as modules, so a fixture in the shared system temp dir would sweep in whatever
# `.noe` files another process left there.
noeta-test-temp = { workspace = true }

[lints]
workspace = true
