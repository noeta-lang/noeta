[package]
name = "noeta-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

# The shared IDE engine (MCP M5, extracted from noeta-lsp): DocumentStore + the analysis modules
# (offsets/resolve/completion/signature/symbols/inlay/semtokens) over the noeta-db salsa graph.
# Deliberately wire-protocol-free — no tower-lsp, no tokio — so `noeta lsp` (JSON-RPC) and
# `noeta mcp` (MCP tools) are both thin adapters over the one implementation and can never drift.

[dependencies]
noeta-span = { workspace = true }
noeta-ast = { workspace = true }
noeta-lexer = { workspace = true }
# The language's own per-name censuses: `REFLECTION_INTRINSICS` is where the thirteen reflection
# primitives' call signatures live, and completion and signature help both read it rather than each
# restating what the checker knows.
noeta-builtins = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-db = { workspace = true }
# The project model — `project_check` and the shared salsa workspace construction. It used to live
# here; it does not any more, because `noeta check` must not pull an editor crate. The editor
# *consumes* it: the DocumentStore overlays unsaved buffers on the same construction the batch
# checker feeds straight through, so the two can never disagree about what a project is.
noeta-project = { workspace = true }
# `ExpandedSource` — the generated sources a link produced, which the addressing layer resolves spans
# through and the diagnostics view re-blames on the directive that produced them.
noeta-loader = { workspace = true }
# Dependency resolution (package-manager P2.1c): the editor resolves the same dependency packages the
# CLI does, so cross-package `use <dep-key>.…` resolves in hover/goto/completion.
# `fmt-config` so the formatter reads its `[fmt]` table through pm's one manifest-discovery walk
# (cross-cutting #14) — `noeta-fmt` is already a direct dependency, so this adds no new crates.
noeta-pm = { workspace = true, features = ["fmt-config"] }
# Member completion on a bare `.` re-lexes/parses/checks a lightly-munged buffer off the salsa graph
# (the dangling `.` otherwise drops the statement, so the receiver never gets a type).
noeta-parser = { workspace = true }
noeta-check = { workspace = true }
# The built-in trait vocabulary (`BUILTIN_TRAITS`) directive-argument completion offers in
# `@derive(...)` — the same table the checker validates derives against.
noeta-types = { workspace = true }
# The impact engine (server-hmr W3) attributes edits with the hot-swap differ.
noeta-compiler = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-fmt = { workspace = true }
# For the `Setter` trait — the salsa-generated `set_text` on `SourceProgram` needs it in scope.
salsa = { workspace = true }
# The language-guide corpus: `docs/*.md` embedded at build time, so the docs
# browser serves the guides with no repo beside the binary — the one canonical loader both `noeta
# lsp` and `noeta mcp` read (the MCP `docs_*` tools delegate here).
include_dir = { workspace = true }

[dev-dependencies]
# `tests/expansion.rs` installs a fixture extension whose directive expands, to prove the editor's
# link runs compile-time expansion exactly as the compiler's does.
noeta-ext-abi = { workspace = true }
# The multi-file workspace fixtures (sibling discovery and path dependencies read a real directory)
# get a per-process temp root, so two test processes never share — and delete — one project.
noeta-test-temp = { workspace = true }
# `tests/editor_vocabulary.rs` generates the editor grammars' keyword/type/prelude vocabulary from
# the three censuses and checks them against it; `serde_json` proves the TextMate grammar is still
# valid JSON after the generator writes into it. (`noeta-builtins`, the prelude census, is a real
# dependency now — the reflection intrinsics' signatures come from it.)
serde_json = { workspace = true }

[lints]
workspace = true
