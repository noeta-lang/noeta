[package]
name = "noeta-pm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-cache = { workspace = true }
noeta-check = { workspace = true }
noeta-loader = { workspace = true }
noeta-fmt = { workspace = true }
semver = { workspace = true }
pubgrub = { workspace = true }
toml = { workspace = true }
# The HTTP registry client (Phase 4, S4) is opt-in so pure/offline consumers (and the LSP) don't pull
# a TLS stack. reqwest is already compiled by the CLI (noeta-runtime), so this shares its rustls.
reqwest = { workspace = true, optional = true, features = ["blocking", "json"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Enable the networked registry `Index` (an HTTP client of the hosted index). Off by default; the CLI
# turns it on. Without it, only the file-backed `LocalIndex` (offline/tests) exists.
registry-http = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[lints]
workspace = true
