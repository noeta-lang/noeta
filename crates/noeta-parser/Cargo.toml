[package]
name = "noeta-parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-edition = { workspace = true }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-lexer = { workspace = true }
# The extension-directive metadata only (`ExtDirective`'s declared sites and argument contract), so
# the rule deciding whether an invocation is legal has one home that both the checker and the
# loader can reach. Every crate that already depends on this one also already depends on ext-abi.
noeta-ext-abi = { workspace = true }
chumsky = { workspace = true }
stacker = { workspace = true }
# One arena per parse holding every `${…}` hole's token buffer, so all of them share the parse's
# lifetime and one hole grammar can serve them all (see `Holes` in `lib.rs`).
typed-arena = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
