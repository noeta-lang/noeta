[package]
name = "noeta-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-ir = { workspace = true }
noeta-ir-passes = { workspace = true }
# For the argument→parameter calling convention only (`is_param_filled`/`param_of_arg`). That rule
# has to be stated once for both backends, and `noeta-vm` deliberately does not depend on noeta-ir
# (see its manifest), so `noeta-bytecode` is the one crate both call prologues can share.
noeta-bytecode = { workspace = true }
noeta-builtins = { workspace = true }
noeta-backend = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-check = { workspace = true }

[dev-dependencies]
# Front-end crates, for end-to-end convenience in unit tests only (no production
# dependency — the lexer/parser do not depend on the evaluator).
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "eval"
harness = false

[lints]
workspace = true
