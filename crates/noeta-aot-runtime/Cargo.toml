[package]
name = "noeta-aot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# P-AOT L3.2b(3): the runtime an ahead-of-time-compiled program links against. Built as a **static
# library** (a single relocatable archive) so `noeta build --native` can `cc`-link a program's AOT
# object against it into a self-contained native executable. It provides the C-ABI `main` entry, the
# exported `noeta_jit_*` helper symbols the native bodies call (via noeta-vm's `aot` feature), and the
# bundle/host machinery to load and run the embedded program.
[lib]
name = "noeta_aot"
crate-type = ["staticlib"]
# A staticlib exporting a C-ABI `main` cannot host a Rust test harness (two `main` symbols) —
# `cargo test --workspace` fails to even build it otherwise. Its coverage lives in the
# `noeta build --native` end-to-end differential, which links and runs the real archive.
test = false
doctest = false

[dependencies]
# `aot` turns on the JIT and exports the `noeta_jit_*` runtime helpers under their canonical C names,
# so the linked-in native bodies resolve their helper calls against this archive.
noeta-vm = { workspace = true, features = ["aot"] }
noeta-bundle = { workspace = true }
noeta-bytecode = { workspace = true }
# Direct path (not workspace inheritance) so we can set `default-features = false` — a workspace
# member may not override the root's default-features when inheriting. This makes this crate's own
# ring features the *only* thing that turns a stdlib ring (and its native deps) on; `noeta build
# --native` selects them per-program (DCE Axis B).
noeta-runtime = { path = "../noeta-runtime", default-features = false }
noeta-stdlib = { workspace = true }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }

[features]
# All rings on by default — the plain archive is fully capable. `noeta build --native`'s footprint
# scan builds this crate with `--no-default-features --features <used rings>` to shed the rest, and
# the linker then drops each unreferenced ring's native dep tree. The `aot` runtime support (on
# `noeta-vm`) is a hard dep feature above, so it survives `--no-default-features`.
default = ["ring-http"]
# The `std.http` outbound-client ring — forwards to reqwest in noeta-runtime.
ring-http = ["noeta-runtime/ring-http"]

# This crate is the one place the whole AOT scheme's `unsafe` lives: a C-ABI `main`, the reference to
# the linker-defined `noeta_aot_dispatch` data symbol, and the `run_module_aot` binding call. Relax
# `unsafe_code` from the workspace `forbid` to `deny` so those three sites can opt in explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
