[package]
name = "noeta-aot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# P-AOT L3.2b(3): the runtime an ahead-of-time-compiled program links against. Built as a **static
# library** (a single relocatable archive) so `noeta build --native` can `cc`-link a program's AOT
# object against it into a self-contained native executable. It provides the C-ABI `main` entry, the
# exported `noeta_jit_*` helper symbols the native bodies call (via noeta-vm's `aot` feature), and the
# bundle/host machinery to load and run the embedded program.
[lib]
name = "noeta_aot"
# `staticlib` is what a plain `noeta build --native` links directly (`libnoeta_aot.a`). `rlib` is added
# so a *composed* AOT runtime (a native-dependency app's `--native` base, dev-deps) can depend on this
# crate as an ordinary Rust library and call `run_embedded_with_extensions` before bundling everything
# into its own staticlib — a staticlib-only crate produces no rlib to link against.
crate-type = ["staticlib", "rlib"]
# A staticlib exporting a C-ABI `main` cannot host a Rust test harness (two `main` symbols) —
# `cargo test --workspace` fails to even build it otherwise. Its coverage lives in the
# `noeta build --native` end-to-end differential, which links and runs the real archive.
test = false
doctest = false

[dependencies]
# `aot` turns on the JIT and exports the `noeta_jit_*` runtime helpers under their canonical C names,
# so the linked-in native bodies resolve their helper calls against this archive.
# Direct path (not workspace inheritance) so we can set `default-features = false` — an inherited
# workspace dep may not override the root's default-features. Dropping noeta-vm's default `compile`
# feature (native-size slice 2) is the point: this runtime runs a *pre-compiled* stapled bundle and
# never compiles source, so the whole compiler front end (noeta-compiler → noeta-check → noeta-ir) is
# shed from a shipped `--native` binary — ~1 MB, and no type-checker/compiler as reachable surface in
# a run-only artifact.
noeta-vm = { path = "../noeta-vm", default-features = false, features = ["aot"] }
noeta-bundle = { workspace = true }
noeta-bytecode = { workspace = true }
# Direct path (not workspace inheritance) so we can set `default-features = false` — a workspace
# member may not override the root's default-features when inheriting. This makes this crate's own
# ring features the *only* thing that turns a stdlib ring (and its native deps) on; `noeta build
# --native` selects them per-program (DCE Axis B).
noeta-host-real = { path = "../noeta-host-real", default-features = false }
# Direct path (not workspace inheritance) so we can set default-features = false — an inherited
# workspace dep may not override default-features. Drops the ring-datetime default (jiff + tzdb) so
# an AOT binary that never imports std.datetime sheds it; the toolchain (noeta-cli) and differential
# (noeta-eval) keep noeta-stdlib default-on, so datetime is present everywhere else.
noeta-stdlib = { path = "../noeta-stdlib", default-features = false }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
# The shared run epilogue (`RunTail`, audit row 1) — the one rendering of a finished run into
# process output. It lives in `noeta-backend` because that is the common ancestor of every
# execution surface: this staticlib reaches it without acquiring the compiler front-end that
# `noeta-runner` (where the CLI's copy of the tail lives) would drag in.
noeta-backend = { workspace = true }

[features]
# All rings on by default — the plain archive is fully capable. `noeta build --native`'s footprint
# scan builds this crate with `--no-default-features --features entry,<used rings>` to shed the rest,
# and the linker then drops each unreferenced ring's native dep tree. The `aot` runtime support (on
# `noeta-vm`) is a hard dep feature above, so it survives `--no-default-features`.
default = ["entry", "ring-http-client", "ring-datetime", "ring-regex"]
# Export the C-ABI `main` entry (dev-deps). Default-on so a plain `--native` links a working entry;
# a *composed* AOT runtime for a native-dependency app depends on this crate with this feature OFF and
# supplies its own `main` (which installs the app's extensions), avoiding a duplicate-`main` link error.
entry = []
# The `std.http` outbound-client ring — forwards to reqwest in noeta-host-real.
ring-http-client = ["noeta-host-real/ring-http-client"]
# (para-namespace F2b) There is no `ring-p2p` here anymore: the p2panda transport left noeta-host-real
# for the `para.p2p` extension crate, so the AOT footprint scan gates it on the *extension* crate's
# own `ring-p2p` feature (through the composed AOT shim), not on this base.
# The `std.datetime` ring — forwards to jiff + the tzdb in noeta-stdlib. Unlike the two rings above
# (host-deps in noeta-host-real), jiff is a *pure* dep in noeta-stdlib, so shedding it needs every
# noeta-stdlib puller in this crate's graph (vm/value/ir/compiler/check/runtime and this crate) to
# pull it `default-features = false` — which they do. So `--no-default-features` (a program that
# never imports `std.datetime`) links no jiff; `--features ring-datetime` (a datetime-using program,
# per the footprint scan) forwards the ring back on. The toolchain and differential are separate
# builds where noeta-cli / noeta-eval keep noeta-stdlib default-on.
ring-datetime = ["noeta-stdlib/ring-datetime"]
# The `std.regex` ring — forwards to the regex engine + its Unicode tables in noeta-stdlib. Same
# pure-dep shape as `ring-datetime` above (not a host dep like the http client), so it rides the
# same `default-features = false` discipline across this crate's noeta-stdlib pullers: a program
# that never imports `std.regex` links no engine and none of the Unicode tables.
ring-regex = ["noeta-stdlib/ring-regex"]

# This crate is the one place the whole AOT scheme's `unsafe` lives: a C-ABI `main`, the reference to
# the linker-defined `noeta_aot_dispatch` data symbol, and the `run_module_aot` binding call. Relax
# `unsafe_code` from the workspace `forbid` to `deny` so those three sites can opt in explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
