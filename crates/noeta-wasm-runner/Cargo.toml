[package]
name = "noeta-wasm-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-backend = { workspace = true }
noeta-bundle = { workspace = true }
noeta-span = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-vm = { workspace = true }
noeta-wasi-host = { workspace = true }

[dev-dependencies]
# The integration test compiles a tiny program to a bundle through the salsa pipeline and runs
# the (native-built) runner binary over it — the runner is target-agnostic by design. Fixtures go
# in per-process directories (`noeta-test-temp`), not the shared system temp dir.
noeta-db = { workspace = true }
noeta-test-temp = { workspace = true }

# One of the workspace's few `unsafe` opt-outs (see ARCHITECTURE.md): reading the stapled-bundle
# slot (W1.2) takes a `read_volatile` of the patchable static — volatile so LLVM cannot
# constant-fold the unpatched zeros — and a `from_raw_parts` over the injected data segment. The
# patched path cannot run under miri (the bytes exist only in a rewritten wasm binary); it is
# gated by the wasm differential oracle instead, exactly like the JIT's native code.
# It re-states the rest of the workspace lints minus `unsafe_code = "forbid"`.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
