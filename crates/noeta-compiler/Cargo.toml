[package]
name = "noeta-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-ast = { workspace = true }
noeta-ir = { workspace = true }
noeta-ir-passes = { workspace = true }
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-builtins = { workspace = true }
noeta-object = { workspace = true }
# The extension-registry mechanism and vocabulary only (Registry, UseKind, the process-default
# handle). The std units are data seeded by the assembling driver — this crate deliberately does
# NOT link noeta-stdlib, so a stdlib method-body edit no longer rebuilds the bytecode compiler
# (audit-6 F2).
noeta-ext-abi = { workspace = true }
noeta-check = { workspace = true }
# The hot-swap differ token-normalizes type-declaration residuals (server-hmr H2).
noeta-lexer = { workspace = true }

[dev-dependencies]
# Tests are their own assembling driver: they seed the process-default registry with the std
# units through the stdlib facade (a dev-dep never re-enters the library build graph).
noeta-stdlib = { workspace = true }
noeta-parser = { workspace = true }

[lints]
workspace = true
