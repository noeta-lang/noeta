[package]
name = "noeta-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-span = { workspace = true }
# The extension registry, for `native_reflect`: reflection has to answer for a native declaration
# exactly as it answers for a `.noe` one, and the registry is that declaration's only source. A leaf
# crate with no `noeta-*` dependencies of its own, so this stays acyclic — and it is what lets the
# ONE reflection lookup resolve natives lazily instead of every artifact carrying a pre-materialized
# copy of the whole registry.
noeta-ext-abi = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
