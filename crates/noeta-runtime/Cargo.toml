[package]
name = "noeta-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-stdlib = { workspace = true }
compact_str = { workspace = true }
tokio = { workspace = true }
getrandom = { workspace = true }
# The outbound HTTP client (the `Network::net_fetch`/`net_spawn` capability on `RealHost`). Optional
# so an AOT binary whose program never imports `std.http` links without reqwest and its ~1.5 MB TLS
# stack (rustls/ring/hyper/h2) — dropped by `noeta build --native`'s per-ring footprint selection
# (DCE Axis B). Default-on: the toolchain and every non-tailored build keep the full client.
reqwest = { workspace = true, optional = true }
# Native OTEL (`telemetry` feature): the real host's OTLP/HTTP-JSON span exporter is hand-rolled
# over reqwest + serde_json — deliberately NOT `opentelemetry-otlp` (which drags tonic/prost), so a
# telemetry build adds no protobuf/gRPC tree. Optional so a non-telemetry build links none of it.
serde_json = { workspace = true, optional = true }

[features]
default = ["ring-http-client", "telemetry"]
# The `std.http` outbound-client ring: pulls reqwest into `RealHost`. Off ⇒ `net_fetch` is a stub
# that errors (never reached — a program that doesn't import `std.http` never calls it), and reqwest
# is absent from the link.
ring-http-client = ["dep:reqwest"]
# Native OTEL span export. Reuses the `ring-http-client` reqwest client (`RealHost::http`) to POST
# spans, so it pulls that ring, plus json + serde_json. On by default for the dev toolchain;
# `--no-default-features` drops it, and AOT footprint selection links it only when a program imports
# `std.telemetry`.
telemetry = ["dep:serde_json", "ring-http-client", "reqwest/json"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "lazy_fs"
harness = false

[lints]
workspace = true
