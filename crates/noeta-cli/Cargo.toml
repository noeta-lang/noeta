[package]
name = "noeta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

# The toolchain is a library (`run_cli(extra)`) so a Phase-3 composed shim can embed it whole;
# the stock binary below is `run_cli(&[])`.
[lib]
name = "noeta_cli"
path = "src/lib.rs"

[[bin]]
name = "noeta"
path = "src/main.rs"

[dependencies]
noeta-alloc-probe = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
# The SIGINT graceful-drain handler (server-hmr S0) awaits `tokio::signal::ctrl_c` on its own
# tiny runtime; `signal` is the only feature the CLI needs directly.
tokio = { workspace = true, features = ["signal", "rt"] }
noeta-span = { workspace = true }
noeta-ast = { workspace = true }
noeta-backend = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
noeta-vm = { workspace = true }
noeta-compiler = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-bundle = { workspace = true }
noeta-cache = { workspace = true }
noeta-check = { workspace = true }
noeta-loader = { workspace = true }
# `noeta check` — and the directory walk `test`/`bench`/`doc`/`expand` share with it. The one
# implementation the LSP's `workspace/diagnostic` and the MCP `check` tool also call, so the three
# surfaces cannot disagree about what "clean" means.
noeta-project = { workspace = true }
# The EDITOR engine, which the check path no longer goes through. What is still wanted from it is
# the docs browser (`guide`/`docs` — `noeta init`'s guide pages and `noeta doc`), the `api` census
# behind `noeta doc`'s stdlib generator, and the impact engine (server-hmr W3) `noeta test/bench
# --watch` narrows reruns with.
noeta-ide = { workspace = true }
noeta-host-real = { workspace = true }
# The shared app-execution core (dev-deps D3): `run`/`--exe` delegate to it so the CLI and the
# standalone lean `noeta-runner` binary execute bundles/modules through one implementation. Its JIT
# rides the CLI's own `jit` feature (below), so `--no-default-features` stays Cranelift-free (the
# workspace entry sets `default-features = false`).
noeta-runner = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-lsp = { workspace = true }
noeta-dap = { workspace = true }
noeta-prof = { workspace = true }
noeta-fmt = { workspace = true }
noeta-pm = { workspace = true, features = ["fmt-config", "registry-http", "provenance", "keyless"] }
noeta-mcp = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
# `noeta upgrade` (toolchain self-update): fetch the latest GitHub release and swap the running
# binary. Blocking reqwest shares the rustls stack the CLI already compiles (noeta-pm's registry
# client uses the same pattern); flate2 + tar unpack the release artifact.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
# `--watch` restart-on-change dev loop (server-hmr W0).
notify = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `noeta fmt --diff` renders unified diffs of the pending reformat.
similar = { workspace = true }
# The interactive `noeta repl` line editor (`repl-tty`): raw-mode editing, history, in-place
# highlighting and TAB completion. Only the editing *mechanics* come from here — what a token is
# coloured as and what completes at the cursor are the compiler's own lexer and the IDE engine,
# through `noeta-ide`. The feature selection is on the workspace entry.
rustyline = { workspace = true, optional = true }

[features]
# The shipped `noeta` binary is JIT-enabled by default (milestone P-JIT): real-host `noeta run`/
# `bench` drive the tier-1 JIT under hot-counter promotion. `--no-default-features` builds a
# Cranelift-free interpreter-only binary (identical behaviour, smaller build).
default = ["jit", "repl-tty"]
jit = ["noeta-vm/jit", "noeta-runner/jit", "noeta-prof/jit"]
# The interactive prompt. Off, `noeta repl` still works — it reads lines exactly as it does from a
# pipe, which is the behaviour every non-terminal caller gets anyway. So a `--no-default-features`
# build loses editing comfort and nothing else.
repl-tty = ["dep:rustyline"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
# Per-process fixture directories for the unit tests and for the test targets that do not use
# `tests/cli/support.rs` (which has its own `CARGO_TARGET_TMPDIR` root) — so two test processes or
# two checkouts never share, and delete, one fixture path.
noeta-test-temp = { workspace = true }
# The hermetic Sigstore (test CA/CT/Rekor) the keyless publish e2e mints against (Phase 5, K4).
noeta-pm = { workspace = true, features = ["keyless-test-fixtures"] }
# The advisory-feed e2e signs a mock feed the client verifies (namespace-protection #1).
ed25519-dalek = { workspace = true }
# The `noeta upgrade` e2e builds a release-shaped tarball fixture (tar.gz + SHA256SUMS) that a
# local HTTP stub serves to the env-seam-redirected upgrade flow.
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }

# The interactive prompt opens only when stdin and stderr are a terminal, so the only way to test it
# is to give it one. `tests/cli/repl_tty.rs` drives `noeta repl` on a real pty. Unix-only — a pty is
# a unix object — and a dev-dependency, so none of it reaches the shipped binary.
[target.'cfg(unix)'.dev-dependencies]
rexpect = { workspace = true }

[lints]
workspace = true
