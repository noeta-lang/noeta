[package]
name = "noeta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The toolchain is a library (`run_cli(extra)`) so a Phase-3 composed shim can embed it whole;
# the stock binary below is `run_cli(&[])`.
[lib]
name = "noeta_cli"
path = "src/lib.rs"

[[bin]]
name = "noeta"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
noeta-span = { workspace = true }
noeta-ast = { workspace = true }
noeta-backend = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
noeta-vm = { workspace = true }
noeta-compiler = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-bundle = { workspace = true }
noeta-cache = { workspace = true }
noeta-check = { workspace = true }
noeta-loader = { workspace = true }
noeta-runtime = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-lsp = { workspace = true }
noeta-dap = { workspace = true }
noeta-prof = { workspace = true }
noeta-fmt = { workspace = true }
noeta-pm = { workspace = true, features = ["registry-http"] }
sha2 = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# The shipped `lang` binary is JIT-enabled by default (milestone P-JIT): real-host `lang run`/
# `bench` drive the tier-1 JIT under hot-counter promotion. `--no-default-features` builds a
# Cranelift-free interpreter-only binary (identical behaviour, smaller build).
default = ["jit"]
jit = ["noeta-vm/jit"]

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
