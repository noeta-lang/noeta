# The package manifest. `name` is the package's **identity** — `company/package`, what a registry
# indexes and a git coordinate resolves to. The `company` half is your scope (change `local` before
# publishing). An identity is a coordinate rather than something you spell in source, so it may look
# like one: `noeta-lang/my-toolkit` is a fine name.
#
# `root` is the segment your own modules derive under, and it IS spelled in source — `src/models.noe`
# becomes the module `app.models`, imported as `use app.models`. Keeping it separate from the identity
# is what lets each be what it is: rename the package and no import changes; give the package a
# hyphenated name and your imports stay legal. Omit `root` and the `package` half is used instead,
# which then has to lex as one identifier.
[package]
name = "@PACKAGE_NAME@"
root = "app"
version = "0.1.0"

# Dependencies live here — add one with `noeta add` (see `noeta add --help`).
# The table key is the local import root — the prefix that dependency's modules derive
# under, so `http = { … }` puts its `client.noe` at `http.client`. The source can be a registry version
# (`version` + the `package` identity it resolves to), a git tag, or a path:
#
# [dependencies]
# http = { version = "^1.2", package = "acme/http" }
# geometry = { path = "../geometry" }

# Every `@name` this package's source writes, and who provides it (`local = "provider[:exported]"`).
# Plain directives (`@openapi`) and **tier directives** — the ones taking a block, `@test { … }`,
# `@sql { … }` — are bound the same way: a `@name` is one namespace, and source cannot tell the two
# apart, so neither does this table.
#
# There are no ambient built-ins: `test`/`bench`/`doc`/`debug` are ordinary tier directives the
# standard library provides, so you name the ones you use. Nothing a dependency provides is ambient
# either — bind it or the `@name` does not resolve. The provider is `"std"`, a package identity
# (`"para/db"`, the precise spelling), or a `[dependencies]` key. Rename to dodge a collision
# between two providers' same-named entries (`crit = "acme/criterion:bench"`).
[directives]
test = "std"
bench = "std"
doc = "std"
debug = "std"

# Build targets are named recipes deciding which of those tier directives are *live*. The baseline —
# any command with no `--target` — ships **no** tiers: it is already the minimal, production
# shape. `development` switches the std tiers on: the live-set is an array of the `[directives]` tier
# names above — a bare name turns a tier on, a `-name` turns one off (handy over `extends`).
#
#   noeta run src/main.noe --target development    # @debug blocks execute
#
# A target decides what a *build* contains, not what is checked: `noeta check` reads inside
# every tier block with no `--target` at all, one tier at a time, and names them in its
# summary (`checked 3 files (tiers: test, debug): …`).
#
# (`noeta test`/`bench`/`doc` always activate their own tier; under `--target` they run
# only if that target makes their tier live. The equivalent boolean sub-table —
# `[targets.development.tiers]` with `test = true` … — is also accepted.)
[targets.development]
tiers = ["test", "bench", "doc", "debug"]

# An explicit name for the baseline: no tiers live. Handy as a stable label for CI and
# release builds — `noeta build src/main.noe --target production`.
[targets.production]
