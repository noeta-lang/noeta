[package]
name = "noeta-prof"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
noeta-alloc-probe = { workspace = true }
# The profiler drives the *production* compile+run pipeline (the same path `noeta run` takes), but
# tier-0 (JIT unarmed) so every frame is interpreter-executed and observable — exactly the tier
# decision `noeta dap` makes. Mirrors the DAP crate's dependency set (reuses the loader, checker,
# compiler, and VM directly — not the salsa IDE queries the LSP uses). No debug compile is needed:
# function names + line tables are always-emitted cold metadata on every `Chunk`.
noeta-span = { workspace = true }
noeta-diagnostics = { workspace = true }
noeta-ast = { workspace = true }
noeta-loader = { workspace = true }
# The shared compile front half (deps + tiers + editions resolve exactly as `noeta run`).
noeta-runner = { workspace = true }
noeta-pm = { workspace = true }
noeta-check = { workspace = true }
noeta-compiler = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-vm = { workspace = true }
noeta-stdlib = { workspace = true }
noeta-host-real = { workspace = true }
# Emit formats: speedscope JSON (serde_json) and an SVG flamegraph (inferno, from folded stacks).
serde_json = { workspace = true }
inferno = { workspace = true }

[features]
# Arm the tier-1 JIT under the sampling profiler (`noeta profile --jit`): enables `noeta-vm`'s JIT so
# hot prototypes run native and the sampler attributes their wall time at the JIT trampoline. Off,
# the profiler is pure tier-0 (Cranelift-free), exactly as before. The CLI's own `jit` feature turns
# this on; `--no-default-features` keeps the profiler tier-0 only.
jit = ["noeta-vm/jit"]

[lints]
workspace = true

[dev-dependencies]
# The alloc-profile test registers the counting allocator (the noeta binary does the same).
noeta-alloc-probe = { workspace = true }
# Every profiled program is written into its own per-process fixture directory (the loader treats the
# containing directory as the module directory), so two test processes never share — or truncate —
# one program file.
noeta-test-temp = { workspace = true }
