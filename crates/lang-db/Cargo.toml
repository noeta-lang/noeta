[package]
name = "lang-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lang-span = { workspace = true }
lang-diagnostics = { workspace = true }
lang-ast = { workspace = true }
lang-lexer = { workspace = true }
lang-parser = { workspace = true }
lang-bytecode = { workspace = true }
lang-compiler = { workspace = true }
lang-check = { workspace = true }
salsa = { workspace = true }

# This crate deliberately does NOT inherit the workspace lint table: the salsa
# `Update` impls for the pass-through result newtypes are `unsafe` (a small,
# audited always-replace surface — see the `replace_update!` macro). It re-states
# the rest of the workspace lints minus `unsafe_code = "forbid"`.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
