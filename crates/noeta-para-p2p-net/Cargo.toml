# The real p2panda transport for the `para.p2p` capability (para-namespace follow-on F2b) — a
# p2panda-net node (gossip + log-sync over iroh/QUIC) plus its group-encryption assembly. Extracted
# out of `noeta-runtime` so the heavy iroh/QUIC/p2panda tree no longer rides in the CLI runtime; the
# `para.p2p` extension owns this node instead of `RealHost`. Depends only on `noeta-native` (for the
# `P2p` trait it implements + `StdError`/`SyncStatus`) and the p2panda/tokio tree — nothing above it,
# so it stays out of any dependency cycle with `noeta-runtime`.
[package]
name = "noeta-para-p2p-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-native = { workspace = true }
# The node owns its OWN multi-thread runtime (persistent gossip/sync tasks outlive individual
# dispatches — a current-thread `block_on`-per-call runtime cannot), plus mpsc for the drain channels.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
futures-util = { workspace = true }
p2panda-net = { workspace = true }
p2panda-core = { workspace = true }
# `spaces` pulls the group-encryption store tables (SqliteSpacesStore) p2panda-spaces needs.
p2panda-store = { workspace = true, features = ["spaces"] }
p2panda-sync = { workspace = true }
p2panda-spaces = { workspace = true }
p2panda-auth = { workspace = true }
p2panda-encryption = { workspace = true }
# Serialize the node's group-encryption Credentials to disk (and, later, spaces ops for the wire).
postcard = { workspace = true }

[lints]
workspace = true
