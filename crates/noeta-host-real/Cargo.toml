[package]
name = "noeta-host-real"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Internal: not a contract crate, so it never goes to crates.io. Only the `*-abi` crates
# carry a stability promise (docs/Extension-Compatibility.md).
publish = false

[dependencies]
# Direct path (not workspace inheritance) so we can set default-features = false — an inherited
# workspace dep may not override default-features. Drops the ring-datetime default (jiff + tzdb) so
# an AOT binary that never imports std.datetime sheds it; the toolchain (noeta-cli) and differential
# (noeta-eval) keep noeta-stdlib default-on, so datetime is present everywhere else.
noeta-stdlib = { path = "../noeta-stdlib", default-features = false }
compact_str = { workspace = true }
# `sync` (Notify/Mutex in `ws.rs` + the WS descriptors) and `macros` (`tokio::select!`) are used by
# this crate's *always-compiled* code, so declare them here rather than relying on a ring
# transitively enabling them. Without this a ring-less `noeta build --native`
# (`noeta-aot-runtime --no-default-features`, no ring pulling reqwest/p2panda) failed to compile
# tokio's private `sync` module — a latent gap surfaced by the composed AOT runtime (dev-deps).
tokio = { workspace = true, features = ["sync", "macros"] }
# Websocket handshake (server-hmr L0b): Sec-WebSocket-Accept = base64(sha1(key + GUID)).
sha1 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
gethostname = { workspace = true }
# The outbound HTTP client (the `Network::net_fetch`/`net_spawn` capability on `RealHost`). Optional
# so an AOT binary whose program never imports `std.http` links without reqwest and its ~1.5 MB TLS
# stack (rustls/ring/hyper/h2) — dropped by `noeta build --native`'s per-ring footprint selection
# (DCE Axis B). Default-on: the toolchain and every non-tailored build keep the full client.
reqwest = { workspace = true, optional = true }
# Native OTEL (`telemetry` feature): the real host's OTLP/HTTP-JSON span exporter is hand-rolled
# over reqwest + serde_json — deliberately NOT `opentelemetry-otlp` (which drags tonic/prost), so a
# telemetry build adds no protobuf/gRPC tree. Optional so a non-telemetry build links none of it.
serde_json = { workspace = true, optional = true }
# (para-namespace F2b) noeta-host-real no longer carries any p2p transport: `RealHost` dropped its
# `P2p` impl, so the p2panda node + its whole iroh/QUIC tree left this crate entirely — it now ships
# with the out-of-tree para-p2p package, owned by the `para.p2p` extension. This crate keeps only the `p2p_app_id`
# config it surfaces to that extension via `P2pProvider::real_p2p`.

[features]
default = ["ring-http-client", "telemetry"]
# The `std.http` outbound-client ring: pulls reqwest into `RealHost`. Off ⇒ `net_fetch` is a stub
# that errors (never reached — a program that doesn't import `std.http` never calls it), and reqwest
# is absent from the link.
ring-http-client = ["dep:reqwest"]
# Native OTEL span export. Reuses the `ring-http-client` reqwest client (`RealHost::http`) to POST
# spans, so it pulls that ring, plus json + serde_json. On by default for the dev toolchain;
# `--no-default-features` drops it, and AOT footprint selection links it only when a program imports
# `std.tracing`.
telemetry = ["dep:serde_json", "ring-http-client", "reqwest/json"]

# `kill(2)` for `Process::signal`/detached-child `kill` (process-signals arc) — the one POSIX call
# std's `Child` doesn't expose (it only offers SIGKILL). `nix`'s *safe* wrapper keeps this crate
# `unsafe`-free (workspace lint `unsafe_code = "forbid"`). Unix-only; non-Unix hosts fall back to
# std's forceful terminate for KILL/TERM and reject other signals.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
criterion = { workspace = true }
# The disk tests and the lazy-read bench write into a per-process fixture directory, so two test
# processes never share — and delete — one file path.
noeta-test-temp = { workspace = true }

[[bench]]
name = "lazy_fs"
harness = false

[lints]
workspace = true
