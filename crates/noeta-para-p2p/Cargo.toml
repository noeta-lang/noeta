[package]
name = "noeta-para-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The convergence core (dep-free CRDTs) and the extension ABI.
noeta-crdt = { workspace = true }
noeta-native = { workspace = true }
# `synced` is a node in the SAME reactive graph as core `std.reactive`, reached through the stable
# opaque seam `noeta_stdlib::reactive::extension_point` (create_source / read_source / wake + the
# view-source hook) — never the engine internals. This one dependency is solely that seam; one-way
# (noeta-stdlib does not depend on this crate). noeta-reactive supplies the `NodeId` handle type.
noeta-reactive = { workspace = true }
noeta-stdlib = { workspace = true }
# The real p2panda transport (para-namespace F2b). Optional and behind the `ring-p2p` ring: when a
# host permits real networking (`RealHost`) this crate owns a live p2panda node; off ⇒ the extension
# uses only the dep-free loopback broker, so a loopback/wasm build never links iroh/QUIC. Needs the
# `iroh-gossip` git `[patch]` in the workspace Cargo.toml (present).
noeta-para-p2p-net = { workspace = true, optional = true }

[features]
# The real-transport ring — **not** default (footprint-gated, like the base's http/datetime rings).
# The composed toolchain/runner enables it (so `noeta run`/`--exe` have real peer networking); the
# AOT footprint scan enables it only for a `--native` binary that imports `para.p2p`/`para.synced`,
# shedding the whole p2panda tree otherwise. Plain `cargo build`/tests link no p2panda — the extension
# uses only its dep-free loopback broker.
ring-p2p = ["dep:noeta-para-p2p-net"]

[dev-dependencies]
# The para-conformance harness runs this crate's moved fixtures with `ParaP2pExtension` registered
# (the fixtures resolve `para.*`, which the default std-only registry cannot).
noeta-conformance = { workspace = true }

[lints]
workspace = true
