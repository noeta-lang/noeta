[package]
name = "noeta-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
noeta-ast = { workspace = true }
noeta-bytecode = { workspace = true }
noeta-value = { workspace = true }
# The cranelift-free ABI surface (frame layout, CompiledFn, helper names, dispatch symbol) lives here
# so an AOT binary can link the runtime support without Cranelift; re-exported below so every
# `noeta_jit::*` path is unchanged.
noeta-jit-abi = { workspace = true }
cranelift-jit = "0.133"
cranelift-object = "0.133"
cranelift-module = "0.133"
cranelift-frontend = "0.133"
cranelift-codegen = "0.133"
cranelift-native = "0.133"

[dev-dependencies]
noeta-span = { workspace = true }
noeta-compiler = { workspace = true }
noeta-lexer = { workspace = true }
noeta-parser = { workspace = true }
# Read the emitted object's symbol table in the L3.1b test (already in-tree via cranelift-object).
object = "0.37"

# This crate deliberately does NOT inherit the workspace lint table: the JIT transmutes
# Cranelift-finalized code pointers to `extern "C" fn` and calls them, which is inherently
# `unsafe`. It re-states the rest of the workspace lints minus `unsafe_code = "forbid"`.
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
