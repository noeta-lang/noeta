[package]
name = "noeta/paginated_client"
version = "0.1.0"

[dependencies]
para = { path = "../../../packages/para-api" }

# `para/api` ships a native extension crate — the `@openapi` directive's compile-time expansion hook
# and the URL percent-encoder its generated code uses. Authorizing it is deliberately explicit; this
# example does not use `@openapi`, but the grant is per package, not per feature.
[trust]
native = ["para/api"]
