[package]
name = "noeta/para_p2p_demo"
version = "0.1.0"

[dependencies]
# The first-party non-default p2p/local-first package, keyed `para` so its native modules address as
# `para.crdt` / `para.p2p` / `para.synced`.
para = { path = "../../packages/para-p2p" }

# Running a package's native Rust code requires the root app to authorize it (Phase 4 trust gate).
[trust]
native = ["para/p2p"]
