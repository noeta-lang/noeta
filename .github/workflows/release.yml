name: Release

# Tag-triggered release. On a `v*` tag:
#   - build the `noeta` binary for linux + macOS (x86_64 + aarch64),
#   - attach the tarballs + SHA256SUMS to a GitHub release,
#   - on a NON-prerelease, dispatch `release-published` to the web repos so docs advances to this
#     release's docs and the sites refresh their version pill.
#
# Prerelease is detected from the tag: any `-` suffix (v1.2.0-rc.1, v1.2.0-alpha) is a prerelease.
# crates.io is intentionally NOT published here — extensions resolve toolchain crates by git, not
# crates.io, and the embedding surface (noeta-embed) isn't stabilized yet. When it is, a
# `publish-crates` job for the noeta-embed dependency closure drops in, gated on non-prerelease.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, linker: gcc-aarch64-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned, and kept in lockstep with `ci.yml` (see the rationale there) — a release build must
      # use the same compiler the gates proved the tree against, not whatever `stable` is that day.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build the noeta binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p noeta-cli --bin noeta

      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/noeta"
          strip "$BIN" || true
          DIST="noeta-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "$BIN" "$DIST/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$DIST/" 2>/dev/null || true
          tar -czf "$DIST.tar.gz" "$DIST"

      - uses: actions/upload-artifact@v4
        with:
          name: noeta-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          generate_release_notes: true

  # Advance the web properties. Docs syncs its content from this release's tag, so it must run only
  # for a real (non-prerelease) release; the landing/playground pills just refresh. GITHUB_TOKEN
  # can't trigger workflows in another repo, so this uses a PAT with `contents: write` on the sites.
  notify-web:
    name: Dispatch to the web repos
    needs: build
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [noeta-docs, noeta-landing, noeta-playground]
    steps:
      - name: repository_dispatch release-published
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/noeta-lang/${{ matrix.repo }}/dispatches" \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"tag\":\"$TAG\"}}"

  # Advance the org-level `NOETA_VERSION` Actions variable to this release. The para package
  # repos' workflows resolve their pinned toolchain from that variable (single bump point), and the
  # native ones guard it against their manifests' toolchain tag pin — so after this advances, a
  # package whose manifests still pin the previous tag goes red with an explicit message rather
  # than failing obscurely. Non-prerelease only: an rc must not move the fleet. GITHUB_TOKEN cannot
  # write org variables — ORG_VARS_PAT is a fine-grained PAT with organization "Variables: write".
  advance-ecosystem-version:
    name: Advance org NOETA_VERSION
    needs: [build, release]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set org variable to ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.ORG_VARS_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          # PATCH updates the existing variable; a 404 means it was never created — POST it.
          gh api -X PATCH "/orgs/noeta-lang/actions/variables/NOETA_VERSION" \
            -f name=NOETA_VERSION -f value="$TAG" \
          || gh api -X POST "/orgs/noeta-lang/actions/variables" \
            -f name=NOETA_VERSION -f value="$TAG" -f visibility=all

  # Build the VS Code extension .vsix and attach it to the GitHub release. Its version is NOT read
  # from package.json — the git tag is the single source of truth, so the extension always ships at
  # the same version as the toolchain (`vX.Y.Z` is stamped in at package time, never committed).
  # This runs for EVERY tag, prereleases included, so an rc build is always a downloadable artifact
  # even when registry publishing is skipped. Depends on `release` so the release exists to attach to.
  package-extension:
    name: Package VS Code extension
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runtime deps only: the extension is not bundled (src/extension.js loads
      # vscode-languageclient from node_modules at runtime), and devDeps are test-only. This mirrors
      # the recipe documented in .vscodeignore.
      - name: Install runtime dependencies
        working-directory: editors/vscode-noeta
        run: npm ci --omit=dev

      # Stamp the tag into package.json (X.Y.Z from vX.Y.Z). --no-git-tag-version keeps it a
      # working-tree-only edit — no commit, no tag — so the tag stays the source of truth.
      # No --no-dependencies on package: that flag drops node_modules from the .vsix, but this
      # extension is unbundled and must ship its production deps.
      - name: Package
        working-directory: editors/vscode-noeta
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npx --yes @vscode/vsce package -o "noeta-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode-noeta/*.vsix

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: editors/vscode-noeta/*.vsix

  # Publish the packaged extension to the registries. Open VSX is the primary channel (it serves
  # VSCodium/Cursor, which the Microsoft Marketplace does not). Each step self-skips when its token
  # secret is absent, so this job stays green while the Marketplace PAT is still being sorted out —
  # the .vsix is already attached to the release regardless. Prereleases are skipped: the stable
  # channels reject `-rc`/`-alpha` version suffixes.
  publish-extension:
    name: Publish VS Code extension
    needs: [build, package-extension]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish dist/*.vsix --pat "$OVSX_PAT"

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix -p "$VSCE_PAT"
