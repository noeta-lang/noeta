name: Release

# Tag-triggered release. On a `v*` tag:
#   - build the `noeta` binary for linux + macOS (x86_64 + aarch64),
#   - package the VS Code extension .vsix,
#   - attach the tarballs + .vsix + a SHA256SUMS covering all of them to a GitHub release,
#   - on a NON-prerelease, dispatch `release-published` to the web repos so docs advances to this
#     release's docs and the sites refresh their version pill.
#
# Prerelease is detected from the tag: any `-` suffix (v1.2.0-rc.1, v1.2.0-alpha) is a prerelease.
# crates.io is intentionally NOT published here — extensions resolve toolchain crates by git, not
# crates.io, and the embedding surface (noeta-embed) isn't stabilized yet. When it is, a
# `publish-crates` job for the noeta-embed dependency closure drops in, gated on non-prerelease.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The full CI suite, reused as the release gate (one definition, no drift): a tag push does not
  # trigger ci.yml on its own, so without this a broken commit could tag-ship binaries and advance
  # the ecosystem's NOETA_VERSION. Everything downstream needs `build`, which needs this.
  gate:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, linker: gcc-aarch64-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          # GitHub retired Intel macOS runners; cross-compile x86_64 from the arm64 runner
          # (the macOS SDK targets both architectures, and the toolchain step installs matrix.target).
          - { os: macos-14, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      # A released binary composes native-package toolchains at `tag = v<CARGO_PKG_VERSION>`, so the
      # binary's baked-in version and the tag it ships under must match EXACTLY — prerelease suffix
      # included (a `v0.2.0-rc.1` tag needs workspace version `0.2.0-rc.1`). A mismatch would ship a
      # binary that composes against a different toolchain tag than the one it was built from.
      - name: Guard tag matches the workspace version
        shell: bash
        run: |
          WORKSPACE_VERSION="$(awk -F'"' '/^\[/{in_ws = ($0 == "[workspace.package]")} in_ws && /^version = /{print $2; exit}' Cargo.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$WORKSPACE_VERSION" ]]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [workspace.package] version ${WORKSPACE_VERSION} — bump [workspace.package] version and tag together (tag v${WORKSPACE_VERSION}, or fix the version and re-tag)"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches workspace version ${WORKSPACE_VERSION}"

      - name: Release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Pinned, and kept in lockstep with `ci.yml` (see the rationale there) — a release build must
      # use the same compiler the gates proved the tree against, not whatever `stable` is that day.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build the noeta binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p noeta-cli --bin noeta

      - name: Package
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/noeta"
          strip "$BIN" || true
          DIST="noeta-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "$BIN" "$DIST/"
          cp LICENSE-MIT LICENSE-APACHE README.md "$DIST/" 2>/dev/null || true
          tar -czf "$DIST.tar.gz" "$DIST"

      - uses: actions/upload-artifact@v4
        with:
          name: noeta-${{ matrix.target }}
          path: "*.tar.gz"

  # Attaches EVERY release asset — the binary tarballs and the extension .vsix — in one step, so
  # the single SHA256SUMS covers all of them. `noeta upgrade` verifies the tarball against it and
  # `noeta ide --vscode` the .vsix; an asset outside the sums file would be uninstallable there.
  release:
    name: Publish GitHub release
    needs: [build, package-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the notes compiler diffs against the previous tag

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.vsix > SHA256SUMS

      # Compile the release notes from the conventional commits since the previous tag: sections
      # per type (breaking changes first), first lines only, trailers dropped. Every commit on main
      # is conventional, so this is the changelog — GitHub's own generator is PR-based and produces
      # only a compare link for a direct-commit history.
      - name: Compile release notes from conventional commits
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          RANGE=${PREV:+${PREV}..}${TAG}
          {
            declare -A SECTION=( [feat]="Features" [fix]="Fixes" [perf]="Performance" \
              [docs]="Documentation" [refactor]="Refactoring" [ci]="CI & build" [build]="CI & build" \
              [test]="Housekeeping" [chore]="Housekeeping" [style]="Housekeeping" )
            ORDER=(Breaking Features Fixes Performance Documentation Refactoring "CI & build" Housekeeping Other)
            CONVENTIONAL='^([a-z]+)(\([^)]*\))?(!)?: (.*)$'
            declare -A BODY
            while IFS= read -r line; do
              subject=${line#* }
              # Merge commits carry no changelog signal of their own.
              [[ "$subject" == Merge\ * ]] && continue
              if [[ "$subject" =~ $CONVENTIONAL ]]; then
                type=${BASH_REMATCH[1]}; scope=${BASH_REMATCH[2]}; bang=${BASH_REMATCH[3]}; msg=${BASH_REMATCH[4]}
                scope=${scope#(}; scope=${scope%)}
                entry="- ${scope:+**${scope}:** }${msg}"
                if [[ -n "$bang" ]]; then key="Breaking"; else key=${SECTION[$type]:-Other}; fi
              else
                entry="- ${subject}"
                key="Other"
              fi
              BODY[$key]+="${entry}"$'\n'
            done < <(git log --no-merges --pretty='%H %s' "$RANGE")
            for key in "${ORDER[@]}"; do
              [[ -n "${BODY[$key]:-}" ]] || continue
              [[ "$key" == "Breaking" ]] && echo "## ⚠ Breaking changes" || echo "## ${key}"
              printf '%s\n' "${BODY[$key]}"
            done
            if [[ -n "$PREV" ]]; then
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > notes.md
          echo "--- notes for ${RANGE}:"; cat notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          body_path: notes.md

  # Advance the web properties. Docs syncs its content from this release's tag, so it must run only
  # for a real (non-prerelease) release; the landing/playground pills just refresh. GITHUB_TOKEN
  # can't trigger workflows in another repo, so this uses a PAT with `contents: write` on the sites.
  notify-web:
    name: Dispatch to the web repos
    needs: build
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [noeta-docs, noeta-landing, noeta-playground]
    steps:
      - name: repository_dispatch release-published
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/noeta-lang/${{ matrix.repo }}/dispatches" \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"tag\":\"$TAG\"}}"

  # Advance the org-level `NOETA_VERSION` Actions variable to this release. The para package
  # repos' workflows resolve their pinned toolchain from that variable (single bump point), and the
  # native ones guard it against their manifests' toolchain tag pin — so after this advances, a
  # package whose manifests still pin the previous tag goes red with an explicit message rather
  # than failing obscurely. Non-prerelease only: an rc must not move the fleet. GITHUB_TOKEN cannot
  # write org variables — ORG_VARS_PAT is a fine-grained PAT with organization "Variables: write".
  advance-ecosystem-version:
    name: Advance org NOETA_VERSION
    needs: [build, release]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set org variable to ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.ORG_VARS_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          # PATCH updates the existing variable; a 404 means it was never created — POST it.
          gh api -X PATCH "/orgs/noeta-lang/actions/variables/NOETA_VERSION" \
            -f name=NOETA_VERSION -f value="$TAG" \
          || gh api -X POST "/orgs/noeta-lang/actions/variables" \
            -f name=NOETA_VERSION -f value="$TAG" -f visibility=all

  # Tell the para package repos to bump their toolchain pin. Their native crates pin these toolchain
  # crates by tag, and their CI guards that pin against `NOETA_VERSION` — so the job above makes
  # every one of them red until the pin follows. Each repo's `toolchain-pin.yml` rewrites its
  # manifests, BUILDS itself against this release, and opens the result as a PR carrying the
  # verdict. That build is the point: a release is exactly when a native package might stop
  # compiling, and this is the only thing in the fleet that asks on a schedule.
  #
  # `needs: advance-ecosystem-version` is load-bearing and not just tidiness. The receiving repo's
  # own CI resolves `NOETA_VERSION` from the org variable; dispatch before that variable moves and
  # the PR arrives carrying the NEW pin while its checks install the OLD toolchain — the consistency
  # guard then fails on a PR that is perfectly correct. Ordering it after removes the race.
  #
  # Fans out to ALL para repos, not only the four with pins: a repo with none no-ops and exits 0, so
  # the workflow is one file everywhere and a package that later grows a native half is covered
  # without anyone remembering to add it here.
  notify-para:
    name: Dispatch to the para repos
    needs: [build, advance-ecosystem-version]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    strategy:
      # Every repo gets its dispatch even if one fails — a bad token for one should not silently
      # leave the rest un-bumped.
      fail-fast: false
      matrix:
        repo:
          [
            para-aether,
            para-aether-db,
            para-ai,
            para-api,
            para-cli,
            para-db,
            para-html,
            para-p2p,
          ]
    steps:
      - name: repository_dispatch release-published
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -fsSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/noeta-lang/${{ matrix.repo }}/dispatches" \
            -d "{\"event_type\":\"release-published\",\"client_payload\":{\"tag\":\"$TAG\"}}"

  # Build the VS Code extension .vsix. Its version is NOT read from package.json — the git tag is
  # the single source of truth, so the extension always ships at the same version as the toolchain
  # (`vX.Y.Z` is stamped in at package time, never committed). This runs for EVERY tag, prereleases
  # included, so an rc build is always a downloadable artifact even when registry publishing is
  # skipped. It runs BEFORE `release`, which attaches the .vsix alongside the tarballs and folds it
  # into the release's SHA256SUMS — the checksum `noeta ide --vscode` verifies the download against.
  package-extension:
    name: Package VS Code extension
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Runtime deps only: the extension is not bundled (src/extension.js loads
      # vscode-languageclient from node_modules at runtime), and devDeps are test-only. This mirrors
      # the recipe documented in .vscodeignore.
      - name: Install runtime dependencies
        working-directory: editors/vscode-noeta
        run: npm ci --omit=dev

      # Stamp the tag into package.json (X.Y.Z from vX.Y.Z). --no-git-tag-version keeps it a
      # working-tree-only edit — no commit, no tag — so the tag stays the source of truth.
      # No --no-dependencies on package: that flag drops node_modules from the .vsix, but this
      # extension is unbundled and must ship its production deps.
      - name: Package
        working-directory: editors/vscode-noeta
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npx --yes @vscode/vsce package -o "noeta-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: editors/vscode-noeta/*.vsix

  # Publish the packaged extension to the registries. Open VSX is the primary channel (it serves
  # VSCodium/Cursor, which the Microsoft Marketplace does not). Each step self-skips when its token
  # secret is absent, so this job stays green while the Marketplace PAT is still being sorted out —
  # the .vsix is already attached to the release regardless. Prereleases are skipped: the stable
  # channels reject `-rc`/`-alpha` version suffixes.
  publish-extension:
    name: Publish VS Code extension
    needs: [build, package-extension]
    if: needs.build.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: dist

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish dist/*.vsix --pat "$OVSX_PAT"

      - name: Publish to the Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix -p "$VSCE_PAT"
