name: CI

# The project's gates, one job each (see docs/Contributing and the crate READMEs):
#   - test   : the workspace suite, which runs the executable-spec conformance corpus, the
#              eval↔interpreter differential oracle, the leak oracle (residency 0), IR-lowering
#              totality, and the drop-safety property — plus every crate's unit tests.
#   - docs   : the documentation-sample gate — every ```noeta block in docs/ must run through the
#              `noeta` binary exactly as tagged (untagged → exit 0, `error` → non-zero, `ignore` → skip).
#   - jit    : the tier-0/tier-1 JIT differential (interpreter vs forced native code, byte-identical
#              RunResult) and the leak-under-JIT check, behind the `jit` cargo feature.
#   - clippy : lints, denying warnings, for both the default build and the `jit` feature.
#   - fmt    : `cargo fmt --check` — the tree is kept stable-rustfmt-clean.
#   - miri   : the one place `unsafe` lives — the NaN-box value model and the cycle collector —
#              run under Miri to prove the refcount/heap paths are sound.
#   - wasm   : the portability invariant behind the WASM target (plans/wasm/): the interpreter
#              pipeline must keep checking on wasm32-wasip1 — no tokio/threads/Cranelift/getrandom
#              may creep onto the default path.
#   - editors: the editor-tooling suites — the tree-sitter grammar (static corpus + the per-project
#              overlay harness, parser regenerated in CI) and the VS Code extension's TextMate
#              grammar tests (indent + interpolation scopes).

on:
  push:
    branches: [main]
  pull_request:
  # Callable as a gate by other workflows — release.yml runs the full suite before building
  # artifacts, so a tag on a commit that would fail CI can never ship a release.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The toolchain is PINNED (`dtolnay/rust-toolchain@1.97.0`, every job below except `miri`, which
# needs nightly) rather than floating on `@stable`. A floating stable makes every new Rust release a
# potential red `main` with no change on our side: `clippy`'s lint set grows each release and the
# `clippy` job denies warnings, so a release day turns unrelated PRs red (1.97 did exactly that — a
# new `question_mark` lint in `noeta-fmt`). Pinning also keeps CI and a developer's local `cargo
# clippy` in agreement, which a floating stable cannot guarantee.
#
# Bumping is deliberate: raise the version here and in `release.yml` together, then fix whatever new
# lints the release brought in that same commit.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep file/line in panic backtraces but drop full debuginfo — the debug target dir is a large
  # multiple smaller, which matters because the composed-toolchain e2e test builds a second
  # toolchain (its own ~700-crate lock) into the same workspace target dir on a ~20 GB runner.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Format (cargo fmt --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  test:
    name: Test & oracles (conformance, differential, leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job runs the composed-toolchain e2e test (via the noeta-cli integration suite), which
      # cargo-builds a second full toolchain; reclaim the ~25 GB of preinstalled runner software the
      # build needs as free disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # The workspace suite is the spine: the conformance corpus, the eval↔interpreter differential
      # (backends must agree, 0 skipped), the leak oracle (residency 0), IR-lowering totality, and the
      # drop-safety property — alongside all unit tests. `noeta-jit` is excluded, and `noeta-cli` too:
      # the shipped CLI now defaults to the `jit` feature (P-JIT), so building it here would pull
      # Cranelift into this job through feature unification. Excluding it keeps this the Cranelift-free
      # library + oracle proof; the `jit` job owns the JIT-enabled CLI, and the lean-CLI build below
      # proves the Cranelift-free binary still compiles (the point of the feature gate).
      - name: cargo test --workspace (default, Cranelift-free)
        run: cargo test --workspace --exclude noeta-jit --exclude noeta-cli --locked
      # The `noeta` binary is JIT-enabled by default; prove `--no-default-features` still yields a
      # working interpreter-only CLI (identical behaviour, no Cranelift).
      - name: lean CLI build (--no-default-features, Cranelift-free)
        run: cargo test -p noeta-cli --no-default-features --locked
      # The out-of-tree native-package round trips (a git-dep package and a registry-index package,
      # each composing a full consumer-side toolchain) are #[ignore]d as too heavy for the default
      # suite — run them explicitly here, where the disk was already reclaimed for compose builds.
      # They share a compose guard, so the runs are serial by construction.
      - name: composed-toolchain e2e (out-of-tree native package, git + registry index)
        run: cargo test -p noeta-cli --no-default-features --locked -- --ignored composed_toolchain
      # The lean feature SHAPES the AOT/native-size/p2p stories depend on, checked cheaply so a
      # latent gap can't hide until a slow `build --native` e2e (it has before: a ring-less native
      # build once failed on tokio's private sync module — see noeta-host-real/Cargo.toml). These are
      # `cargo check` only: the goal is "compiles in this shape", not another test run.
      - name: lean feature shapes compile (aot / no-default hosts / ring-p2p)
        run: |
          cargo check -p noeta-vm --no-default-features --features aot --locked
          cargo check -p noeta-vm --no-default-features --features jit,aot --locked
          cargo check -p noeta-host-real --no-default-features --locked
          cargo check -p noeta-stdlib --no-default-features --locked

  docs:
    name: Documentation samples (docs/*.md ```noeta blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # Every ```noeta code sample in the wiki must run through the real `noeta` binary exactly as
      # tagged. This keeps the docs honest — a renamed method or changed diagnostic fails here instead
      # of silently misleading readers. Run Cranelift-free (`--no-default-features`): the JIT is a
      # byte-identical accelerator, so doc behaviour is unchanged and the gate stays fast.
      - name: cargo test -p noeta-cli --test doc_samples
        run: cargo test -p noeta-cli --test doc_samples --no-default-features --locked

  jit:
    name: JIT gate (tier-0/1 differential + leak-under-JIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same as the test job: the JIT-enabled CLI step runs the composed-toolchain e2e test, which
      # cargo-builds a second full toolchain — reclaim the preinstalled runner software as free disk.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # The eval↔interpreter differential never exercises the JIT (it is a real-host accelerator that
      # falls back to the interpreter), so the JIT ships its own oracle: interpreter vs forced tier-1
      # native code must produce a byte-identical RunResult and leave zero heap residency.
      - name: JIT unit tests (noeta-vm)
        run: cargo test -p noeta-vm --features jit --locked
      - name: JIT differential + leak-under-JIT corpus gate
        run: cargo test -p noeta-conformance --features jit --locked
      - name: JIT differential (coverage summary)
        run: cargo run -p noeta-conformance --features jit --locked -- --jit-differential
      # The shipped CLI defaults to the `jit` feature, so its integration tests and doc-sample gate now
      # exercise the production hot-counter JIT end-to-end (real-host `noeta run`/`test`). Gate that path.
      - name: JIT-enabled CLI (integration + doc samples)
        run: cargo test -p noeta-cli --locked
      # The shipped examples are code users copy and the docs link to by path, so a language change
      # must not be able to invalidate them unnoticed — it twice did (the sealed-fn and no-shadowing
      # rules each broke a LiveView example, and both sat broken because the only tests referencing
      # an example were `#[ignore]`d socket tests). The core sweep runs with the suite above. The
      # `para` packages (and their examples) live in their own repos under github.com/noeta-lang,
      # each gated by its own CI.

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Default build excludes `noeta-jit` and `noeta-cli` (both pull Cranelift — noeta-cli via its
      # default `jit` feature; kept Cranelift-free here, like the `test` job); the jit step lints them.
      - name: Clippy (default features)
        run: cargo clippy --workspace --exclude noeta-jit --exclude noeta-cli --all-targets --locked -- -D warnings
      # Lint the JIT code path, the `vm_jit` bench, and the JIT-enabled CLI — they only pull Cranelift
      # under the `jit` feature (noeta-cli by default).
      - name: Clippy (jit feature)
        run: >
          cargo clippy -p noeta-vm -p noeta-jit -p noeta-conformance -p noeta-cli
          --features "noeta-vm/jit noeta-conformance/jit" --all-targets --locked -- -D warnings

  wasm:
    name: WASM portability (wasm32-wasip1 check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-wasip1,wasm32-unknown-unknown,wasm32-wasip2
      # Node 26's V8 ships JSPI unflagged, so the browser smoke exercises the W3.1 pump (the
      # script degrades to the serial-fallback assertions on older runtimes, printing which).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@v2
      # The wasm target (plans/wasm/) rides on the interpreter pipeline being OS-free: every effect
      # behind the `Host` trait, threads/Cranelift feature-gated off the default path. That held by
      # architecture before it was ever checked; this job makes it an invariant instead of an
      # accident. Check (not build): linkage is the runner crate's concern, portability is this one's.
      - name: cargo check pipeline crates (wasm32-wasip1)
        run: >
          cargo check -p noeta-vm -p noeta-stdlib -p noeta-compiler -p noeta-lexer
          -p noeta-parser -p noeta-loader -p noeta-db -p noeta-bundle -p noeta-eval
          --target wasm32-wasip1 --locked
      # The wasm differential oracle (W1.3): every corpus program, bundled and executed by the
      # wasm runner under wasmtime (--sandbox), must match the native VM byte-for-byte — stdout,
      # exit code, and rendered stderr. The wasm analogue of the bundle oracle's L1.3 gate.
      # Pinned direct release download: install.sh resolves "latest" via the unauthenticated
      # GitHub API, which rate-limits on shared runner IPs and once yielded a literal `{` as the
      # version — succeeding with nothing installed. v46 matches the workspace's wasmtime-internal
      # crates; bump both together.
      - name: Install wasmtime (pinned)
        run: |
          V=v46.0.1
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${V}/wasmtime-${V}-x86_64-linux.tar.xz" | tar -xJ
          "./wasmtime-${V}-x86_64-linux/wasmtime" --version
          echo "NOETA_WASMTIME=${PWD}/wasmtime-${V}-x86_64-linux/wasmtime" >> "$GITHUB_ENV"
          echo "${PWD}/wasmtime-${V}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Build the wasm runner (the shipping artifact profile)
        run: cargo build -p noeta-wasm-runner --target wasm32-wasip1 --profile wasm-release --locked
      - name: Wasm differential oracle (runner under wasmtime vs native VM)
        run: cargo run -p noeta-conformance --locked -- --wasm-differential
      # The browser engine (W2): the playground cdylib must build for wasm32-unknown-unknown and
      # actually execute in a plain JS embedding — the node smoke drives check/run/fmt through the
      # hand-rolled ABI, the same way a Web Worker embedding does. The frontend that embeds this
      # engine (page, worker, share codec, deploy) lives in the separate noeta-playground repo
      # (play.noeta.dev), which builds this same cdylib from a lang checkout.
      - name: Build the playground engine (wasm32-unknown-unknown)
        run: cargo build -p noeta-playground --target wasm32-unknown-unknown --profile wasm-release --locked
      - name: Browser-engine smoke (node over the raw ABI)
        run: node crates/noeta-playground/tests/browser_smoke.mjs target/wasm32-unknown-unknown/wasm-release/noeta_playground.wasm
      # The edge-serve payoff (W4): `noeta build --serve` a real handler, run the wasi:http
      # component under `wasmtime serve`, assert a live HTTP round trip.
      - name: wasi:http serve e2e (component under wasmtime serve)
        run: bash crates/noeta-wasm-serve/tests/e2e.sh
      # Distribution blobs: the generic wasm engines double as the packaged-toolchain artifacts.
      - name: Upload the generic wasm engines
        uses: actions/upload-artifact@v4
        with:
          name: wasm-engines
          path: |
            target/wasm32-wasip1/wasm-release/noeta-wasm-runner.wasm
            target/wasm32-wasip2/wasm-release/noeta_wasm_serve.wasm

  miri:
    name: Miri (unsafe value & collector paths)
    runs-on: ubuntu-latest
    env:
      # Miri interprets ~100× slower, so bound proptest to a small case count — enough to exercise the
      # NaN-box round-trips and refcount transitions without a runaway. `disable-isolation` lets the
      # heap's process-global bookkeeping run.
      PROPTEST_CASES: 16
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri setup
        run: cargo miri setup
      # `noeta-value` (the NaN-box value model + heap header) and `noeta-gc` (the cycle collector) are the
      # crates that opt out of the workspace `unsafe_code = "forbid"` for the refcount/collector paths.
      - name: cargo miri test (noeta-value, noeta-gc)
        run: cargo miri test -p noeta-value -p noeta-gc --locked

  editors:
    name: Editor tooling (tree-sitter grammar + VS Code extension)
    runs-on: ubuntu-latest
    # Like every job in this file, this also gates releases: release.yml reuses the whole workflow
    # via `workflow_call`, so editor-tooling drift (grammar vs queries, TextMate scopes) blocks a
    # tag from shipping just like a failing oracle would.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The VS Code extension's TextMate-grammar tests: indent rules and the string-interpolation
      # scope assertions (vscode-textmate/oniguruma driven, no VS Code host needed).
      - name: VS Code extension tests
        working-directory: editors/vscode-noeta
        run: |
          npm ci
          npm test
      # The tree-sitter grammar. `src/parser.c` is generated and gitignored (only the hand-written
      # `src/scanner.c` is tracked), so CI MUST `tree-sitter generate` before testing. `npm test`
      # then runs the static corpus (also validating queries/*.scm against the compiled grammar)
      # plus the per-project overlay harness (test/project/run.js), which regenerates with custom
      # tiers in a temp dir and asserts generation is deterministic.
      - name: tree-sitter grammar tests
        working-directory: editors/tree-sitter-noeta
        run: |
          npm ci
          npm run generate
          npm test
